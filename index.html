<!DOCTYPE html>
<html lang="es"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071226">
<title>IT Tycoon — De Helpdesk a CEO</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Nunito:wght@500;700;800&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root{--bg:#071226;--pan2:#0b1a3a;--ln:#27478a;--tx:#f3f8ff;--mu:#93acd6;--org:#ff8a3d;--cyn:#2fd4ff;--grn:#2ee66b;--red:#ff4d6d;--vio:#a78bfa;--gold:#ffc83d;--hd:"Fredoka","Nunito",system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,Consolas,monospace}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;color:var(--tx);font:700 15px/1.45 "Nunito",system-ui,Segoe UI,Arial,sans-serif;background:radial-gradient(ellipse at 90% -10%,#2f1d78,transparent 50%),radial-gradient(ellipse at -10% 105%,#06607a,transparent 50%),linear-gradient(rgba(47,212,255,.05) 1px,transparent 1px) 0 0/30px 30px,linear-gradient(90deg,rgba(47,212,255,.05) 1px,transparent 1px) 0 0/30px 30px,var(--bg);overscroll-behavior-y:none}
.shell{max-width:820px;margin:auto;padding:16px 18px calc(112px + env(safe-area-inset-bottom,0px))}
button,input,textarea{font:inherit;color:inherit}button{cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--cyn);outline-offset:2px}
.mu{color:var(--mu)}.mono{font-family:var(--mono)}.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.col{display:grid;gap:12px;max-width:360px;margin:0 auto}
.sub{font-size:13px;color:var(--mu);font-weight:500;margin:4px 0}
h3{font:600 19px/1.2 var(--hd);margin:0 0 6px;display:flex;justify-content:space-between;gap:8px;align-items:center}
/* ventanas */
.card{background:linear-gradient(#173064,#112551);border:2px solid var(--ln);border-radius:18px;box-shadow:0 5px 0 #06122b;margin-bottom:14px;overflow:hidden;animation:pop .28s ease both}
@keyframes pop{from{opacity:0;transform:translateY(8px)}}
.card.star{border-color:var(--gold)}
.card.mgc{border-color:var(--cyn);box-shadow:0 5px 0 #062840}
.wb{display:flex;align-items:center;gap:6px;padding:7px 12px;background:#0a1836;border-bottom:2px solid var(--ln);font:500 11px var(--mono);color:var(--mu)}
.wb i{width:10px;height:10px;border-radius:50%;background:#ff5f57}.wb i:nth-child(2){background:#febc2e}.wb i:nth-child(3){background:#28c840}.wb span{margin-left:6px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wc{padding:14px}
/* botones tipo app */
.btn{font:600 19px var(--hd);border:0;border-radius:15px;padding:12px 20px;background:linear-gradient(#5cf58f,#18c456);color:#04361a;border-bottom:5px solid #0a7d37;transition:transform .08s,border-width .08s}
.btn:active:not(:disabled){transform:translateY(3px);border-bottom-width:2px}.btn.w{width:100%}.btn.y{background:linear-gradient(#ffd86b,#f5a623);color:#4a2e00;border-bottom-color:#a8680a}.btn.s{font-size:16px;padding:7px 14px}
.btn:disabled{background:#33405f;color:#7b8aab;border-bottom-color:#1d2740;cursor:not-allowed}
.gh{font:500 15px var(--hd);border:2px solid var(--ln);border-bottom-width:4px;background:var(--pan2);border-radius:12px;padding:7px 13px;transition:transform .08s}
.gh:active:not(:disabled){transform:translateY(2px);border-bottom-width:2px}.gh.on{border-color:var(--cyn);background:#0d3a57}.gh:disabled{opacity:.45;cursor:not-allowed}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid #0007;padding:0}.sw.on{border-color:#fff;box-shadow:0 0 0 3px var(--cyn)}
/* HUD */
.hud{position:sticky;top:0;z-index:20;margin:-12px -12px 14px;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 10px;background:linear-gradient(#0e2b69f5,#0a1e48f5);border-bottom:3px solid #1d3e86;backdrop-filter:blur(8px)}
.hr{display:flex;align-items:center;gap:9px}
.avb{width:54px;height:54px;border-radius:17px;border:3px solid var(--gold);overflow:hidden;flex:none;box-shadow:0 3px 0 #8a6200}.avb svg,.hv svg{display:block;width:100%;height:100%}
.hn{flex:1;min-width:0;font:600 19px/1.1 var(--hd)}.hn small{display:block;font:500 12px "Nunito";color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.coin{display:flex;align-items:center;gap:5px;background:linear-gradient(#ffd86b,#f5a623);color:#4a2e00;font:600 17px var(--hd);border-radius:99px;padding:4px 12px 4px 5px;border-bottom:4px solid #a8680a;flex:none}
.coin b{width:25px;height:25px;border-radius:50%;background:#fff3c4;display:grid;place-items:center;font-size:13px}.coin.neg{background:linear-gradient(#ff8097,#e0405e);color:#fff;border-bottom-color:#7a1a2c}
.snd{width:36px;height:36px;border-radius:12px;border:2px solid var(--ln);border-bottom-width:4px;background:var(--pan2);display:grid;place-items:center;font-size:16px;flex:none;padding:0}
.snd:active{transform:translateY(2px);border-bottom-width:2px}
.vg{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:9px}
.v{background:#09152f;border:2px solid #1d3e86;border-radius:12px;padding:4px 8px}.v .n{display:flex;justify-content:space-between;font:500 12px var(--hd)}
.bar{height:8px;border-radius:9px;background:#050c1d;margin-top:3px;overflow:hidden}.bar i{display:block;height:100%;border-radius:9px;transition:width .5s}.bar.lo i{animation:pl 1s infinite}@keyframes pl{50%{opacity:.4}}
.sts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.st{font:500 12px var(--hd);border:2px solid var(--ln);border-radius:99px;padding:0 10px;background:var(--pan2)}.st.w{border-color:var(--red);color:#ff8097}
/* toast móvil */
.toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:50;background:linear-gradient(#0d3a57,#09283d);border:2px solid var(--cyn);color:#fff;font:600 14px var(--hd);padding:9px 16px;border-radius:99px;box-shadow:0 8px 24px #0009;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis;animation:tdn .25s ease}
@keyframes tdn{from{opacity:0;transform:translate(-50%,-14px)}}
/* ticket / decisiones */
.q{font-size:clamp(18px,4.8vw,21px);line-height:1.3;font-weight:800;margin:0 0 14px}
.ch{display:grid;gap:10px}
.c{display:block;width:100%;text-align:left;font:800 15px "Nunito";color:#fff;background:linear-gradient(#2f72f5,#2050c4);border:0;border-bottom:5px solid #12307a;border-radius:14px;padding:13px 14px;transition:transform .08s}
.c:active:not(:disabled){transform:translateY(3px);border-bottom-width:2px}.c.sk{background:linear-gradient(#25c96f,#16984f);border-bottom-color:#0b5f31}.c.cold{background:linear-gradient(#e8455f,#a82a42);border-bottom-color:#611728}
.c.lock{background:#1b2a4d;border-bottom-color:#101b36;color:#8197c0;cursor:not-allowed}.c small{display:block;font-weight:500;opacity:.9;font-size:12px;margin-top:2px}.bd{display:inline-block;font-size:11px;background:#0004;border-radius:99px;padding:0 8px;margin-right:6px}
.chip{display:inline-block;font:600 13px var(--hd);padding:1px 11px;border-radius:99px;margin:0 6px 6px 0;background:var(--pan2);border:2px solid}
.up{color:var(--grn);border-color:#1f8a4c}.dn{color:#ff8097;border-color:#a8344b}.ne{color:var(--cyn);border-color:#1f7d99}
.out{font-size:18px;line-height:1.35;margin:0 0 12px}
.stamp{display:inline-block;font:700 15px var(--hd);color:var(--gold);border:3px solid var(--gold);padding:0 12px;border-radius:8px;transform:rotate(-3deg);margin-bottom:10px;animation:sp .3s cubic-bezier(.3,1.6,.5,1)}@keyframes sp{from{transform:rotate(-3deg) scale(2.2);opacity:0}}
.note{background:#3a2a07;border:2px solid var(--gold);border-radius:12px;padding:9px 12px;margin-bottom:10px;font-size:14px}.note.b{background:#3a1224;border-color:var(--red)}.note.of{background:#0d3a57;border-color:var(--cyn);cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:8px}
.par{border-top:2px dashed var(--ln);padding-top:10px;margin:8px 0 12px}.alt{background:var(--pan2);border-radius:10px;padding:8px 11px;margin-bottom:7px;font-size:14px;font-weight:500}.alt b{display:block;color:var(--mu);font-size:12px}
.tickr{display:flex;gap:10px;align-items:center;background:#08122a;border:2px solid var(--ln);border-radius:12px;padding:6px 12px;margin-bottom:14px;font-size:13px}.tickr span{font:600 11px var(--mono);color:var(--bg);background:var(--red);border-radius:6px;padding:1px 7px;white-space:nowrap}.tickr p{margin:0;font-weight:500}
/* minijuegos irónicos */
.mg-box{background:#08152e;border:2px dashed var(--cyn);border-radius:16px;padding:16px 14px;text-align:center;margin:8px 0 12px}
.mg-tag{display:inline-block;font:700 11px var(--mono);letter-spacing:.06em;background:#0d3a57;color:var(--cyn);border:1px solid var(--cyn);border-radius:99px;padding:2px 10px;margin-bottom:8px}
.mg-stage{min-height:185px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;margin:8px 0}
.mg-big{font:700 17px var(--hd);border:0;border-radius:16px;padding:14px 20px;background:linear-gradient(#38bdf8,#0284c7);color:#041e30;border-bottom:5px solid #075985;transition:transform .08s}
.mg-big:active{transform:translateY(3px) scale(.97);border-bottom-width:2px}
.mg-big.red{background:linear-gradient(#ff6b85,#e11d48);color:#fff;border-bottom-color:#881337}
.mg-pwr{width:104px;height:104px;border-radius:50%;background:radial-gradient(#263859,#0e182d);border:5px solid var(--red);color:var(--red);font:700 38px var(--hd);display:grid;place-items:center;box-shadow:0 0 24px #ff4d6d44;transition:transform .08s,border-color .2s,color .2s}
.mg-pwr:active{transform:scale(.92)}
.mg-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;width:100%}
.mg-tab{background:#2c1220;border:2px solid var(--red);border-radius:12px;padding:10px 8px;font:700 12px var(--mono);color:#ff9eb0;display:flex;justify-content:space-between;align-items:center;animation:shk .45s infinite alternate}
@keyframes shk{from{transform:rotate(-1.2deg)}to{transform:rotate(1.2deg)}}
.mg-postit{background:linear-gradient(#fef08a,#facc15);color:#3b2f00;border:0;border-bottom:4px solid #ca8a04;border-radius:10px;padding:13px 8px;font:700 13px var(--mono);box-shadow:0 4px 10px #0006;transform:rotate(-1.5deg)}
.mg-postit:nth-child(even){transform:rotate(1.8deg)}
.mg-postit:active{transform:scale(.9)}
.mg-tog{display:flex;align-items:center;justify-content:space-between;width:100%;max-width:290px;background:#112551;border:2px solid var(--org);border-radius:14px;padding:12px 16px;font:700 16px var(--hd)}
.mg-pill{width:54px;height:30px;border-radius:99px;background:var(--org);position:relative;transition:background .2s}
.mg-pill::after{content:'';position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;background:#fff}
.mg-prog{width:100%;max-width:260px;height:12px;background:#050c1d;border-radius:99px;border:2px solid var(--ln);overflow:hidden}
.mg-prog i{display:block;height:100%;background:linear-gradient(90deg,var(--org),var(--grn));transition:width .18s}
.mg-say{font-size:13px;color:var(--gold);font-style:italic;min-height:20px}
/* noticias */
.paper{background:#f4ecd8;color:#2b2112;border-radius:10px;padding:10px 14px;font-family:Georgia,serif;transform:rotate(-.6deg);border:2px dashed #b9a77a;margin:4px 0 12px}.paper small{font:700 10px var(--mono);letter-spacing:.1em;color:#8a7648}.paper h4{margin:3px 0;font-size:17px;line-height:1.25}.paper p{margin:0;font:700 12px "Nunito";color:#5b6a2f}
.nw{display:flex;gap:10px;padding:10px;border-radius:13px;background:var(--pan2);border:2px solid var(--ln);margin-bottom:8px}.nw.me{border-color:var(--gold);background:#2a2208}.ni{font-size:26px}.nw b{font-weight:700;line-height:1.3;display:block}
/* ficha / atributos / talentos */
.pf{display:flex;gap:14px;align-items:center}.hv{width:120px;height:120px;border-radius:28px;overflow:hidden;border:4px solid var(--gold);box-shadow:0 6px 0 #8a6200;margin:0 auto 10px;flex:none;animation:bob 3s ease-in-out infinite}.hv.sm{width:88px;height:88px;border-radius:22px;margin:0;animation:none}@keyframes bob{50%{transform:translateY(-6px)}}
.at{display:grid;grid-template-columns:104px 1fr auto;gap:10px;align-items:center;margin:8px 0}.at .bar{height:10px;margin:0}.pm{width:34px;height:34px;border-radius:10px;border:2px solid var(--ln);background:var(--pan2);font-weight:800}.pm:disabled{opacity:.3}
.opt{border:2px solid var(--ln);border-radius:14px;padding:10px 12px;background:var(--pan2);margin-bottom:8px}.opt.sel{border-color:var(--grn);background:#0f3a2c}
.br{margin-bottom:12px}.tr{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.nd{border:2px solid var(--ln);border-radius:12px;padding:8px 10px;background:var(--pan2);font-size:13px;display:flex;flex-direction:column;gap:3px}.nd.own{border-color:var(--grn);background:#0f3a2c}.nd.bad{border-color:var(--red);background:#3a1224}.nd span{color:var(--mu);font-size:12px;font-weight:500}.nd button{margin-top:auto;border:0;border-bottom:3px solid #0a7d37;border-radius:9px;background:var(--grn);color:#04361a;font:600 14px var(--hd);padding:5px 8px}.nd button:disabled{background:#33405f;color:#7b8aab;border-bottom-color:#1d2740}
.lad{display:grid;gap:7px}.rg{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;border:2px solid var(--ln);border-radius:12px;padding:8px 12px;background:var(--pan2)}.rg.now{border-color:var(--grn);background:#0f3a2c}.rg.past{opacity:.55}
.ii{font-size:34px;line-height:1;flex:none}.of{display:flex;gap:12px;border:2px solid var(--cyn);border-radius:14px;padding:12px;background:#0b2a4a;margin-bottom:10px;box-shadow:0 4px 0 #05182b}
/* tienda */
.shop{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:14px}
.it{position:relative;display:flex;flex-direction:column;gap:5px;background:linear-gradient(#173064,#112551);border:2px solid var(--ln);border-radius:16px;padding:12px;box-shadow:0 4px 0 #06122b}.it.own{border-color:var(--grn)}.it .btn{margin-top:auto}
.rib{position:absolute;top:8px;right:-6px;background:var(--red);color:#fff;font:600 12px var(--hd);padding:1px 10px;border-radius:6px 0 0 6px;font-style:normal;transform:rotate(3deg)}
input[type=text],textarea{width:100%;background:var(--pan2);border:2px solid var(--ln);border-radius:12px;padding:10px 12px;font-weight:700}textarea{min-height:90px;font:500 12px var(--mono)}
ol.l{padding-left:20px;color:var(--mu);font-size:14px;font-weight:500;margin:6px 0 0}.end h2{font:600 clamp(28px,7vw,40px)/1.05 var(--hd);margin:4px 0 8px}

/* Startup y Ranking */
.rk-row{display:grid;grid-template-columns:34px 36px 1fr auto;gap:8px;align-items:center;border:2px solid var(--ln);border-radius:12px;padding:8px 10px;background:var(--pan2);font-size:13px}
.rk-row.me{border-color:var(--gold);background:#2a2208;box-shadow:0 3px 0 #8a6200}
.rk-pos{font:700 15px var(--hd);text-align:center;color:var(--cyn)}
.rk-row.me .rk-pos{color:var(--gold)}
.su-banner{background:linear-gradient(120deg,#1a1040,#0d2e5c);border:2px solid var(--gold);border-radius:16px;padding:12px 14px;margin-bottom:12px}

/* portada */
.hero{position:relative;text-align:center;padding-top:20px}
.hero h1{font:700 clamp(58px,18vw,92px)/.95 var(--hd);margin:0;background:linear-gradient(#fff,#7fe9ff 60%,#2fd4ff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 5px 0 #0a2a66)}
.tag{display:inline-block;font:600 20px var(--hd);background:linear-gradient(#5cf58f,#18c456);color:#04361a;border-bottom:4px solid #0a7d37;border-radius:99px;padding:2px 20px;margin-top:6px}
.fl{position:absolute;font-size:34px;pointer-events:none;animation:bob 4s ease-in-out infinite}.fl.f1{left:2%;top:40px}.fl.f2{right:3%;top:30px;animation-delay:-1s}.fl.f3{left:4%;top:190px;animation-delay:-2s}.fl.f4{right:2%;top:200px;animation-delay:-3s}
/* barra navegación inferior móvil */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(820px,100%);display:grid;grid-template-columns:repeat(7,1fr);gap:2px;padding:6px 5px calc(7px + env(safe-area-inset-bottom,0px));background:linear-gradient(#0e2b69fa,#081634fc);border-top:3px solid #1d3e86;z-index:30;backdrop-filter:blur(10px)}
.nav button{position:relative;border:0;background:transparent;color:var(--mu);font:600 10px var(--hd);padding:6px 0 4px;display:flex;flex-direction:column;align-items:center;border-radius:12px;transition:background .15s,color .15s}.nav .i{font-size:21px;line-height:1.15;transition:transform .15s}
.nav button:active{transform:scale(.93)}
.nav button.on{color:#fff;background:#14377a;box-shadow:inset 0 3px 0 var(--grn)}.nav button.on .i{transform:translateY(-2px) scale(1.12)}
.bdg{position:absolute;top:1px;right:8%;background:var(--red);color:#fff;border-radius:99px;font:700 10px var(--hd);min-width:16px;height:16px;display:grid;place-items:center;padding:0 4px;box-shadow:0 2px 4px #0008}
footer{text-align:center;color:#587199;font-size:12px;font-weight:500;margin-top:18px}
.card{box-shadow:0 8px 24px #0003,0 4px 0 #06122b;transition:transform .18s,border-color .18s}.card:hover{border-color:#3e69bd}.wc{padding:clamp(14px,2.5vw,22px)}
.company-grid{display:grid;gap:8px}.company-mini{display:flex;align-items:center;gap:10px;background:#0b1a3a;border:1px solid #27478a;border-radius:13px;padding:9px}.company-mini .co-logo{width:42px;height:42px;border-radius:12px;font-size:21px}.company-mini .co-tier{font-size:9px;white-space:nowrap}.co-logo{width:58px;height:58px;display:grid;place-items:center;flex:none;border-radius:17px;background:linear-gradient(145deg,#f4f8ff,#a9c7ed);color:#10234a;font:800 27px var(--hd);box-shadow:inset 0 0 0 3px #ffffff55,0 4px 0 #06122b}.co-logo small{font:800 10px var(--mono);letter-spacing:-.08em}.co-tier{display:inline-block;border:1px solid #4e77b8;border-radius:99px;padding:2px 8px;color:#b8d5ff;font:700 10px var(--mono);letter-spacing:.04em}.talent-help{background:#0b3150;border:1px solid #2876a0;border-radius:12px;padding:10px 12px;margin:8px 0;color:#d9f4ff;font-size:13px}.talent-effect{display:block;color:#a9bfe0;font-size:11px;margin-top:5px}.world-panel{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;background:linear-gradient(110deg,#123c67,#10244c);border:1px solid #3472a6;border-radius:15px;padding:11px 14px;margin:10px 0 12px;box-shadow:inset 0 1px #ffffff12}
.world-icon{font-size:27px;width:42px;height:42px;display:grid;place-items:center;background:#071a34;border-radius:12px}
.world-title{font:700 14px var(--hd);color:#8ee7ff}.world-desc{font-size:12px;color:#c1d3ef;font-weight:500;margin-top:2px}
.goal{margin-top:8px}.goal-line{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:#d4e4ff}.goal .bar{height:6px;background:#061126}
.kicker{font:700 10px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--cyn);margin-bottom:6px}
@media(min-width:700px){.shell{padding-top:22px}.hud{border-radius:0 0 18px 18px;padding-left:20px;padding-right:20px}.q{font-size:22px}.ch{grid-template-columns:1fr 1fr}.c{height:100%;min-height:88px}.nav button{font-size:11px}}
@media(max-width:420px){.shell{padding-left:10px;padding-right:10px}.at{grid-template-columns:88px 1fr auto}.hn{font-size:17px}.vg{gap:5px}.nav button{font-size:9px}.nav .i{font-size:20px}.world-panel{padding:9px 10px;gap:8px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.scn{display:block;width:100%;height:auto;border-radius:12px;margin-bottom:12px;border:2px solid var(--ln)}
details{border:2px solid var(--ln);border-radius:14px;margin:8px 0;padding:0 12px;background:#0b1a3a}summary{font:600 17px var(--hd);padding:10px 0;cursor:pointer}details[open]{padding-bottom:12px}
.quip{font-style:italic;color:var(--mu);font-weight:500;border-left:3px solid var(--gold);padding:2px 0 2px 10px;margin:8px 0}
.subtabs{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}.sbr{border-top:2px dashed var(--ln);margin-top:10px;padding-top:8px}.sbt{font:600 15px var(--hd);margin-bottom:6px}
.scn{display:block;width:100%;height:auto;border-radius:14px;margin-bottom:12px;border:2px solid var(--ln);box-shadow:0 4px 0 #06122b}

/* === GAME DEV TYCOON ROOM, LIVE WORK DECK & EMERGING POPUPS === */
.shell.in-play{max-width:860px;min-height:100vh;min-height:100dvh;margin:0 auto;padding:0 0 calc(84px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;background:#050c1a}
.shell.in-play footer{display:none}
.shell.in-play #app{flex:1;display:flex;flex-direction:column;width:100%;position:relative}

/* Top Simulation HUD */
.gdt-topbar{position:sticky;top:0;z-index:25;background:linear-gradient(180deg,#0d224efa,#081534fa);border-bottom:2px solid #24478f;padding:calc(6px + env(safe-area-inset-top,0px)) 12px 8px;box-shadow:0 6px 20px #0009;backdrop-filter:blur(8px)}
.gdt-top-row1{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.gdt-co-id{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
.gdt-co-txt{min-width:0;flex:1}
.gdt-co-txt b{display:block;font:700 15px/1.15 var(--hd);color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gdt-co-txt small{display:block;font:600 11px var(--mono);color:#8ee7ff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gdt-sim-ctrls{display:flex;align-items:center;gap:4px;background:#061024;border:1.5px solid #27478a;border-radius:99px;padding:3px 6px;flex:none}
.gdt-spd{border:0;background:transparent;color:var(--mu);font:700 11px var(--mono);padding:4px 8px;border-radius:99px;cursor:pointer}
.gdt-spd.on{background:#18438c;color:#fff;box-shadow:0 0 8px #2fd4ff66}
.gdt-next-btn{border:0;background:linear-gradient(#ffd86b,#f59e0b);color:#3b2000;font:700 11px var(--hd);padding:4px 10px;border-radius:99px;border-bottom:2px solid #92400e;cursor:pointer}
.gdt-next-btn:active{transform:translateY(1px)}
.gdt-top-row2{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-top:6px}
.gdt-vital{background:#071229;border:1.5px solid #1d3b78;border-radius:10px;padding:3px 6px;display:flex;flex-direction:column;gap:2px}
.gdt-vital-hd{display:flex;justify-content:space-between;align-items:center;font:700 11px var(--hd)}
.gdt-vital .bar{height:5px;margin:0}
.gdt-sub-pills{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:5px;flex-wrap:wrap}
.gdt-mini-pills{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.gdt-pill{font:600 10px var(--mono);padding:1px 8px;border-radius:99px;background:#0a1938;border:1px solid #284c94;color:#cbd5e1}
.gdt-pill.warn{border-color:var(--red);color:#ff8097;background:#2b0e1d}
.gdt-pill.ok{border-color:var(--grn);color:#86efac;background:#092e20}

/* 2.5D Office Room Stage — Full Width, Never Cropped */
.gdt-room-stage{position:relative;width:100%;aspect-ratio:600/310;max-height:50vh;min-height:220px;background:#040a17;border-bottom:3px solid #24478f;overflow:hidden;user-select:none;display:flex;align-items:center;justify-content:center;cursor:pointer}
.gdt-room-svg{width:100%;height:100%;display:block}
.gdt-particles{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:12}
.gdt-pop-bubble{position:absolute;font:800 13px var(--mono);padding:4px 11px;border-radius:99px;background:#07142cf5;border:2px solid var(--cyn);color:#fff;box-shadow:0 6px 16px #000a;white-space:nowrap;animation:gdtBubbleUp 2.1s cubic-bezier(.18,.88,.32,1) forwards}
@keyframes gdtBubbleUp{0%{opacity:0;transform:translate(-50%,10px) scale(.7)}15%{opacity:1;transform:translate(-50%,0) scale(1.06)}30%{transform:translate(-50%,-10px) scale(1)}85%{opacity:1}100%{opacity:0;transform:translate(-50%,-78px) scale(.9)}}

/* Live Control Deck Below Room */
.gdt-deck{padding:12px 14px;display:flex;flex-direction:column;gap:10px;flex:1}
.gdt-sprint-box{background:linear-gradient(145deg,#132a5c,#0b1a3c);border:2px solid #2b54a3;border-radius:16px;padding:12px 14px;box-shadow:0 5px 0 #06122b}
.gdt-sprint-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.gdt-sprint-title{font:700 15px var(--hd);color:#fff;display:flex;align-items:center;gap:7px}
.gdt-sprint-pct{font:700 12px var(--mono);color:var(--cyn)}
.gdt-sprint-bar{width:100%;height:13px;background:#050c1d;border-radius:99px;border:2px solid #1e3e7a;overflow:hidden;margin-bottom:10px}
.gdt-sprint-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cyn),var(--grn));width:0%;transition:width .15s linear}
.gdt-deck-btns{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:8px}
.gdt-act-btn{font:600 14px var(--hd);border:2px solid #2e59a8;border-bottom-width:4px;border-radius:13px;padding:10px 12px;background:#0d224c;color:#e0f2fe;display:flex;align-items:center;justify-content:center;gap:7px;cursor:pointer;transition:transform .08s}
.gdt-act-btn:active:not(:disabled){transform:translateY(2px);border-bottom-width:2px}
.gdt-act-btn.ready{background:linear-gradient(135deg,#ffd86b,#f59e0b);color:#3b2000;border-color:#fbbf24;border-bottom-color:#92400e;font-weight:700;animation:gdtIncomingPulse 1.15s ease-in-out infinite}
.gdt-act-btn.mg{background:linear-gradient(135deg,#67e8f9,#0284c7);color:#041e30;border-color:#7dd3fc;border-bottom-color:#075985;font-weight:700;animation:gdtIncomingPulse 1.15s ease-in-out infinite}
@keyframes gdtIncomingPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
.gdt-status-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.gdt-info-tile{background:#091734;border:1.5px solid #214385;border-radius:13px;padding:9px 12px;font-size:12px;color:#cbd5e1}
.gdt-info-tile b{color:var(--gold);font:700 13px var(--hd);display:block;margin-bottom:2px}

/* Emerging Ticket Modal Over Room */
.modal-backdrop{position:fixed;inset:0;z-index:40;background:rgba(4,10,24,.64);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:calc(12px + env(safe-area-inset-top,0px)) 12px calc(78px + env(safe-area-inset-bottom,0px));overflow-y:auto;animation:fadeIn .18s ease}
.modal-box{width:min(680px,100%);max-height:100%;overflow-y:auto;margin:auto;animation:modalPop .26s cubic-bezier(.2,1.25,.4,1) both}
.modal-box .card{margin-bottom:0;box-shadow:0 22px 60px #000d,0 6px 0 #06122b;border-width:2.5px;border-color:var(--cyn)}
.modal-top-actions{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;gap:8px}
.modal-pill{background:#091c3df0;border:1.5px solid var(--cyn);color:#8ee7ff;font:700 11px var(--mono);padding:4px 11px;border-radius:99px}

/* Secondary Tab Drawer Overlay */
.tab-overlay{position:fixed;inset:0;z-index:35;background:rgba(4,10,24,.85);backdrop-filter:blur(6px);display:flex;flex-direction:column;padding:calc(10px + env(safe-area-inset-top,0px)) 12px calc(82px + env(safe-area-inset-bottom,0px));overflow-y:auto;animation:fadeIn .18s ease}
.tab-overlay-inner{width:min(820px,100%);margin:0 auto}
.tab-close-bar{display:flex;align-items:center;justify-content:space-between;background:linear-gradient(#122a5c,#0b1b3d);border:2px solid var(--cyn);border-radius:15px;padding:9px 14px;margin-bottom:12px;position:sticky;top:0;z-index:10;box-shadow:0 8px 24px #0009}

/* Full-Screen Big Alert for Significant Milestones */
.big-alert-backdrop{position:fixed;inset:0;z-index:95;background:radial-gradient(circle at 50% 38%,rgba(22,52,112,.94),rgba(3,8,20,.97));backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;padding:18px;animation:fadeIn .22s ease}
.big-alert-card{width:min(490px,100%);background:linear-gradient(160deg,#1a3a78,#0d1f47);border:3px solid var(--gold);border-radius:28px;padding:26px 22px 22px;text-align:center;box-shadow:0 26px 70px #000e,0 0 50px #ffc83d44;animation:bigZoom .38s cubic-bezier(.18,1.4,.38,1) both;position:relative;overflow:hidden}
.big-alert-card::before{content:'';position:absolute;inset:-40%;background:conic-gradient(from 0deg,transparent,rgba(255,200,61,.12),transparent 30%);animation:spinRay 9s linear infinite;pointer-events:none}
@keyframes spinRay{to{transform:rotate(360deg)}}
@keyframes bigZoom{from{opacity:0;transform:scale(.68) translateY(24px)}to{opacity:1;transform:scale(1) translateY(0)}}
.big-alert-tag{position:relative;display:inline-block;font:800 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;padding:5px 15px;border-radius:99px;background:#09152fcc;border:1.5px solid var(--gold);color:var(--gold);margin-bottom:14px}
.big-alert-icon{position:relative;margin:0 auto 14px;display:grid;place-items:center;animation:bob 2.4s ease-in-out infinite}
.big-alert-title{position:relative;font:700 clamp(24px,6vw,32px)/1.1 var(--hd);color:#fff;margin:0 0 10px;text-shadow:0 3px 0 #06122b}
.big-alert-desc{position:relative;font:600 15px/1.45 "Nunito";color:#dbeafe;margin:0 0 20px}

.brand-svg{display:inline-block;vertical-align:middle;flex:none;border-radius:10px;box-shadow:0 2px 6px #0006}
@keyframes fadeIn{from{opacity:0}}
@keyframes modalPop{from{opacity:0;transform:translateY(22px) scale(.94)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes gdtBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.5px)}}
@keyframes gdtTypeL{0%,100%{transform:translate(0,0)}50%{transform:translate(2.2px,-3px)}}
@keyframes gdtTypeR{0%,100%{transform:translate(0,-2.2px)}50%{transform:translate(-2.2px,0.8px)}}
@keyframes gdtSteam{0%{opacity:0;transform:translateY(0) scale(.8)}40%{opacity:.75}100%{opacity:0;transform:translateY(-18px) scale(1.35)}}
@keyframes gdtPulse{0%,100%{opacity:.55}50%{opacity:1}}
.anim-bob{animation:gdtBob 1.05s ease-in-out infinite}
.anim-typel{animation:gdtTypeL .24s ease-in-out infinite}
.anim-typer{animation:gdtTypeR .24s ease-in-out infinite}
.anim-steam{animation:gdtSteam 2.3s ease-out infinite}
.anim-steam2{animation:gdtSteam 2.3s ease-out 1.15s infinite}
.anim-pulse{animation:gdtPulse 1.7s ease-in-out infinite}
@media(max-width:480px){
  .gdt-top-row2{grid-template-columns:repeat(5,1fr);gap:4px}
  .gdt-vital{padding:2px 4px}
  .gdt-vital-hd{font-size:10px}
}


/* === EXPANSIÓN STARTUP CEO: PERSONAL, PROYECTOS Y CENTRO DE MANDO === */
.su-nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.su-nav button{flex:1;min-width:110px;font:700 13px var(--hd);padding:8px 10px;border-radius:12px;border:2px solid var(--ln);border-bottom-width:4px;background:var(--pan2);color:var(--mu);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.su-nav button.on{background:#153878;color:#fff;border-color:var(--gold);box-shadow:0 0 12px #ffc83d33}
.su-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:8px;margin:10px 0}
.su-kpi{background:#081530;border:1.5px solid #264a8f;border-radius:12px;padding:8px 10px;text-align:center}

.staff-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;margin-top:10px}

.staff-area{display:inline-block;font:700 10px var(--mono);padding:2px 7px;border-radius:99px;background:#0b2548;border:1px solid var(--cyn);color:#8ee7ff}
.sk-bars{display:grid;gap:4px;background:#071228;border-radius:10px;padding:7px 9px;border:1px solid #1d3972}

/* === HACKER DEPT, MALICIOUS STARTUP, UPGRADES & HIGH-RANK REWARDS === */
.hk-banner{background:linear-gradient(135deg,#180926,#091a16);border:2px solid #2ee66b;border-radius:16px;padding:12px 14px;margin-bottom:12px;box-shadow:0 0 24px #2ee66b22}

.hk-card{background:linear-gradient(160deg,#121c2e,#09121e);border:2px solid #235946;border-radius:15px;padding:12px;display:flex;flex-direction:column;gap:7px;box-shadow:0 4px 0 #050a14}
.hk-card.hired{border-color:#2ee66b;background:linear-gradient(160deg,#0b2b22,#071a15)}
.upg-pill{display:inline-flex;align-items:center;gap:5px;font:700 11px var(--mono);padding:4px 9px;border-radius:99px;background:#0d2e22;border:1.5px solid var(--grn);color:#86efac}

.tal-step button{border:0;border-bottom:3px solid #0a7d37;border-radius:9px;background:var(--grn);color:#04361a;font:700 12px var(--hd);padding:6px 10px;white-space:nowrap;flex:none}

/* === INTERFAZ DE HABILIDADES ESTILO CUADRÍCULA + RANURAS ACTIVAS === */
.wt-wrap{display:grid;grid-template-columns:1fr;gap:14px;margin-top:10px}

.wt-slot:hover{border-color:var(--cyn)}
.wt-slot.fill{border-style:solid;background:#10244d}
.wt-slot.lk{opacity:.42;cursor:not-allowed;border-style:dotted}
.wt-slot .wt-sic{font-size:20px;line-height:1}
.wt-slot .wt-slv{font:800 9px var(--mono);color:var(--gold)}
.wt-slot .wt-snm{font:700 8px var(--hd);color:#dbeafe;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wt-syn{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;height:100%;min-height:64px;border-radius:11px;border:2px solid #223c73;background:#071022;padding:4px}
.wt-syn.on{box-shadow:0 0 14px rgba(255,200,61,.25)}
.wt-syn b{font:800 11px var(--mono);line-height:1.1}
.wt-syn small{font:600 9px "Nunito";color:var(--mu);line-height:1.15;margin-top:2px}


/* === v12: INTERFAZ MÁS AGRADABLE, LIMPIA Y NOTIFICACIONES SIN ABRUMAR === */
:root{
  --bg:#0b1220;--pan2:#131d31;--ln:rgba(148,163,184,.20);
  --tx:#edf2f7;--mu:#94a3b8;
  --org:#f59e0b;--cyn:#38bdf8;--grn:#34d399;--red:#fb7185;--vio:#a78bfa;--gold:#fbbf24;
}
body{
  font:500 15px/1.5 "Nunito",system-ui,Segoe UI,Arial,sans-serif;
  background:radial-gradient(ellipse at 85% -15%,rgba(56,189,248,.12),transparent 52%),
             radial-gradient(ellipse at 10% 110%,rgba(139,92,246,.12),transparent 52%),
             var(--bg);
}
.shell.in-play{background:#0b1220}
h3{font:600 18px/1.25 var(--hd);color:#f8fafc;letter-spacing:.01em}

/* Tarjetas más suaves y limpias */
.card{
  background:linear-gradient(180deg,#162238,#111b2e);
  border:1px solid rgba(148,163,184,.2);
  border-radius:18px;
  box-shadow:0 10px 28px rgba(2,6,23,.35);
}
.card:hover{border-color:rgba(148,163,184,.34)}
.card.star{border-color:rgba(251,191,36,.55)}
.card.mgc{border-color:rgba(56,189,248,.55);box-shadow:0 10px 28px rgba(2,6,23,.4)}
.wb{background:#0f172a;border-bottom:1px solid rgba(148,163,184,.15);padding:8px 14px;font-size:11px}
.wb i{width:8px;height:8px;opacity:.75}

/* Botones refinados sin sombras duras tipo cartoon */
.btn{
  font:600 16px var(--hd);border-radius:13px;padding:11px 18px;
  background:linear-gradient(180deg,#34d399,#10b981);color:#042f2e;
  border:0;border-bottom:3px solid #059669;
  box-shadow:0 4px 14px rgba(16,185,129,.22);
  transition:transform .12s ease,filter .15s ease;
}
.btn:hover:not(:disabled){filter:brightness(1.05)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn.y{
  background:linear-gradient(180deg,#fcd34d,#f59e0b);color:#451a03;
  border-bottom-color:#d97706;box-shadow:0 4px 14px rgba(245,158,11,.2);
}
.btn.s{font-size:14px;padding:8px 14px}
.btn:disabled{background:#1e293b;color:#64748b;border-bottom-color:#0f172a;box-shadow:none}
.gh{
  font:600 14px var(--hd);border:1px solid rgba(148,163,184,.24);
  background:rgba(30,41,59,.72);color:#e2e8f0;border-radius:11px;padding:7px 13px;
  transition:background .15s,border-color .15s,transform .1s;
}
.gh:hover:not(:disabled){background:rgba(51,65,85,.85);border-color:rgba(148,163,184,.4)}
.gh.on{border-color:var(--cyn);background:rgba(14,116,144,.32);color:#fff}

/* Opciones de decisión más legibles y reposadas */
.c{
  font:700 14.5px/1.35 "Nunito";color:#f1f5f9;
  background:linear-gradient(180deg,#1d2d4a,#16233b);
  border:1px solid rgba(56,189,248,.32);border-left:4px solid var(--cyn);
  border-bottom-width:1px;border-radius:14px;padding:13px 15px;
  box-shadow:0 4px 12px rgba(2,6,23,.25);
  transition:transform .12s,border-color .15s,background .15s;
}
.c:hover:not(:disabled){background:linear-gradient(180deg,#233658,#1a2a47);border-color:rgba(56,189,248,.65);transform:translateY(-1px)}
.c.sk{background:linear-gradient(180deg,#12332c,#0d2621);border-color:rgba(52,211,153,.4);border-left-color:var(--grn)}
.c.cold{background:linear-gradient(180deg,#381926,#29121c);border-color:rgba(251,113,133,.4);border-left-color:var(--red)}
.c.lock{background:#121a2b;border:1px solid rgba(148,163,184,.14);border-left:4px solid #475569;color:#64748b;box-shadow:none}
.c small{color:#94a3b8;font-weight:600;margin-top:4px}

/* HUD Superior limpio y aireado */
.gdt-topbar{
  background:rgba(15,23,42,.88);
  border-bottom:1px solid rgba(148,163,184,.18);
  padding:calc(8px + env(safe-area-inset-top,0px)) 14px 10px;
  box-shadow:0 8px 24px rgba(2,6,23,.35);
  backdrop-filter:blur(14px);
}
.gdt-co-txt b{font:600 15px/1.2 var(--hd);color:#f8fafc}
.gdt-co-txt small{color:#94a3b8;font:600 11px var(--mono)}
.gdt-sim-ctrls{background:rgba(15,23,42,.9);border:1px solid rgba(148,163,184,.22);padding:3px 5px;gap:3px}
.gdt-spd{color:#94a3b8;padding:4px 8px}
.gdt-spd.on{background:rgba(56,189,248,.22);color:#e0f2fe;box-shadow:none}
.gdt-next-btn{background:linear-gradient(180deg,#fcd34d,#f59e0b);border-bottom:0;padding:5px 11px}
.gdt-vital{background:rgba(15,23,42,.65);border:1px solid rgba(148,163,184,.16);border-radius:10px;padding:5px 8px}
.gdt-vital .bar{height:5px;background:rgba(15,23,42,.9)}
.gdt-pill{background:rgba(30,41,59,.65);border:1px solid rgba(148,163,184,.18);color:#cbd5e1;padding:2px 9px}
.gdt-pill.ok{background:rgba(16,185,129,.14);border-color:rgba(52,211,153,.35);color:#a7f3d0}
.gdt-pill.warn{background:rgba(244,63,94,.14);border-color:rgba(251,113,133,.4);color:#fecdd3}

/* Botón campana de avisos */
.ntf-bell{
  position:relative;width:30px;height:30px;border-radius:9px;
  border:1px solid rgba(148,163,184,.24);background:rgba(30,41,59,.8);
  color:#e2e8f0;display:grid;place-items:center;font-size:14px;padding:0;flex:none;
}
.ntf-bell.has{border-color:rgba(251,191,36,.6);background:rgba(251,191,36,.15)}
.ntf-dot{
  position:absolute;top:-4px;right:-4px;min-width:15px;height:15px;padding:0 4px;
  border-radius:99px;background:#f59e0b;color:#451a03;font:800 9px var(--mono);
  display:grid;place-items:center;
}

/* Escenario 3D y panel de control más serenos */
.gdt-room-stage{border-bottom:1px solid rgba(148,163,184,.2);background:radial-gradient(circle at 50% 42%,#162440,#09101d 78%)}
.gdt-pop-bubble{
  font:700 11px var(--mono);padding:3px 9px;
  background:rgba(15,23,42,.82);border-width:1px;
  box-shadow:0 4px 12px rgba(0,0,0,.35);
}
.gdt-sprint-box{
  background:linear-gradient(180deg,#162238,#111b2e);
  border:1px solid rgba(148,163,184,.2);box-shadow:0 8px 24px rgba(2,6,23,.3);
}
.gdt-sprint-bar{height:10px;background:#09101d;border:1px solid rgba(148,163,184,.2)}
.gdt-act-btn{
  border:1px solid rgba(148,163,184,.24);border-bottom-width:1px;
  background:rgba(30,41,59,.78);color:#e2e8f0;border-radius:12px;padding:10px 12px;
  transition:background .15s,border-color .15s,transform .1s;
}
.gdt-act-btn:hover:not(:disabled){background:rgba(51,65,85,.9);border-color:rgba(148,163,184,.4)}
.gdt-act-btn.ready{
  background:linear-gradient(180deg,#fcd34d,#f59e0b);color:#451a03;
  border-color:#fbbf24;animation:none;box-shadow:0 4px 16px rgba(245,158,11,.25);
}
.gdt-act-btn.mg{
  background:linear-gradient(180deg,#38bdf8,#0284c7);color:#f0f9ff;
  border-color:#7dd3fc;animation:none;box-shadow:0 4px 16px rgba(56,189,248,.25);
}
.gdt-info-tile{background:rgba(15,23,42,.72);border:1px solid rgba(148,163,184,.16)}
.tickr{background:rgba(15,23,42,.72);border:1px solid rgba(148,163,184,.18)}
.tickr span{background:rgba(251,113,133,.2);color:#fda4af;border:1px solid rgba(251,113,133,.35)}

/* Barra inferior estilo cristal flotante */
.nav{
  background:rgba(15,23,42,.92);border-top:1px solid rgba(148,163,184,.2);
  backdrop-filter:blur(14px);
}
.nav button{color:#94a3b8;font-weight:600;border-radius:11px}
.nav button.on{color:#f8fafc;background:rgba(56,189,248,.16);box-shadow:inset 0 2px 0 var(--cyn)}
.bdg{background:#f59e0b;color:#451a03}

/* Modales y paneles secundarios más cómodos */
.modal-backdrop{background:rgba(2,6,23,.58);backdrop-filter:blur(6px)}
.modal-box .card{border:1px solid rgba(56,189,248,.4);box-shadow:0 24px 64px rgba(0,0,0,.6)}
.tab-overlay{background:rgba(6,11,22,.84);backdrop-filter:blur(8px)}
.tab-close-bar{background:rgba(15,23,42,.95);border:1px solid rgba(148,163,184,.24);box-shadow:0 8px 24px rgba(0,0,0,.35)}

/* Minijuegos más tranquilos (sin temblor molesto) */
.mg-tab{animation:none;border-width:1.5px}

/* === BANNER DE AVISOS NO INTRUSIVO (reemplaza el modal gigante bloqueante) === */
.ntf-banner{
  position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:12px;z-index:85;
  width:min(360px,calc(100vw - 24px));
  background:rgba(15,23,42,.95);border:1px solid rgba(148,163,184,.28);border-left:4px solid var(--gold);
  border-radius:16px;padding:12px 13px;
  box-shadow:0 16px 40px rgba(0,0,0,.52);backdrop-filter:blur(12px);
  display:flex;flex-direction:column;gap:8px;
  animation:ntfSlide .22s ease both;
}
@keyframes ntfSlide{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
.ntf-head{display:flex;align-items:flex-start;gap:10px}
.ntf-ic{width:38px;height:38px;border-radius:10px;background:rgba(30,41,59,.9);display:grid;place-items:center;font-size:21px;flex:none;overflow:hidden}
.ntf-ic svg{width:34px;height:34px}
.ntf-body{flex:1;min-width:0}
.ntf-tag{font:700 9.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--gold);margin-bottom:2px}
.ntf-title{font:700 14.5px/1.2 var(--hd);color:#f8fafc;margin:0}
.ntf-desc{font:500 12.5px/1.38 "Nunito";color:#cbd5e1;margin:3px 0 0}
.ntf-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:4px;border-top:1px solid rgba(148,163,184,.12)}
.ntf-x{border:0;background:transparent;color:#94a3b8;font-size:16px;padding:2px 6px;border-radius:8px;cursor:pointer}
.ntf-x:hover{color:#fff;background:rgba(148,163,184,.14)}

/* Toast suave abajo-centro encima del nav */
.toast{
  top:auto;bottom:calc(82px + env(safe-area-inset-bottom,0px));
  background:rgba(15,23,42,.92);border:1px solid rgba(56,189,248,.4);
  color:#e2e8f0;font:600 13px "Nunito";padding:8px 15px;
  box-shadow:0 10px 26px rgba(0,0,0,.42);backdrop-filter:blur(10px);
}

/* Bandeja desplegable de avisos */
.ntf-panel{
  position:fixed;top:calc(58px + env(safe-area-inset-top,0px));right:12px;z-index:88;
  width:min(380px,calc(100vw - 24px));max-height:66vh;overflow-y:auto;
  background:rgba(15,23,42,.97);border:1px solid rgba(148,163,184,.28);border-radius:16px;
  padding:12px;box-shadow:0 20px 50px rgba(0,0,0,.6);backdrop-filter:blur(14px);
}
.ntf-item{
  padding:9px 10px;border-radius:11px;background:rgba(30,41,59,.55);
  border:1px solid rgba(148,163,184,.14);margin-bottom:7px;font-size:12.5px;
}
.ntf-item:last-child{margin-bottom:0}
.ntf-item b{display:block;color:#f8fafc;font:700 13px var(--hd)}


.gdt-vital-hd{white-space:nowrap;gap:2px;font-size:10.5px}
@media(max-width:480px){
  .gdt-vital-hd{font-size:9.5px}
  .gdt-top-row1{gap:6px}
  .gdt-co-id{min-width:130px}
}


/* === v15: ENCUADRE MÓVIL PERFECTO + EDITOR LOGO STARTUP + PROYECTOS POR FASES === */
body{max-width:100%;overflow-x:clip}
.shell,.shell.in-play{max-width:100%;overflow-x:clip}
.gdt-room-svg{filter:none!important}
.tab-overlay{
  padding:calc(8px + env(safe-area-inset-top,0px)) 10px calc(76px + env(safe-area-inset-bottom,0px));
  overflow:hidden;display:flex;flex-direction:column;
}
.tab-overlay-inner{
  width:min(820px,100%);max-width:100%;margin:0 auto;
  display:flex;flex-direction:column;flex:1;min-height:0;min-width:0;
}
.tab-close-bar{
  position:relative;top:auto;flex:none;margin-bottom:10px;
  gap:8px;padding:9px 12px;min-width:0;
}
.tab-close-bar b{
  min-width:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px!important;
}
.tab-close-bar button{flex:none;white-space:nowrap}
.tab-scroll{
  flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;padding-bottom:16px;
}
.card,.wc,.wt-wrap,.wt-wrap>*,.wt-grid-box,.wt-slots-panel,.wt-insp,.proj-card,.staff-card{min-width:0;max-width:100%}
.wt-grid-box{padding:10px;overflow:hidden}
.wt-tier{grid-template-columns:44px minmax(0,1fr);gap:7px}
.wt-node{min-width:0;max-width:100%;overflow:hidden;padding:8px}
.wt-ninfo{min-width:0;flex:1}
.wt-ninfo b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wt-ninfo small{
  white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden;line-height:1.25;margin-top:2px;
}
.wt-eq-tag{font-size:8.5px;padding:2px 5px}
.wt-tab{min-width:0;overflow:hidden}
.wt-tab span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(max-width:480px){
  .wc{padding:12px}
  .wt-ic{width:36px;height:36px;font-size:18px}
  .wt-cluster{grid-template-columns:1fr 58px;gap:6px;padding:7px}
}

/* Editor de Logo Startup */
.logo-studio{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;background:rgba(15,23,42,.72);border:1px solid rgba(148,163,184,.2);border-radius:14px;padding:12px;margin:8px 0 12px}
.logo-preview{display:grid;place-items:center;padding:6px;background:rgba(2,6,23,.5);border-radius:16px;border:1px solid rgba(148,163,184,.22)}
.pal-dot{width:28px;height:28px;border-radius:50%;border:2px solid rgba(255,255,255,.25);padding:0;cursor:pointer;transition:transform .1s}
.pal-dot.on{border-color:#fff;box-shadow:0 0 0 2px var(--cyn);transform:scale(1.1)}
@media(max-width:480px){.logo-studio{grid-template-columns:1fr;justify-items:center;text-align:center}}

/* Proyectos Elaborados: Fases, Calidad, Hype y Alcance */
.proj-phases{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0}
.proj-ph{background:rgba(15,23,42,.75);border:1px solid rgba(148,163,184,.2);border-radius:10px;padding:6px 7px;text-align:center;font:700 10.5px var(--mono);color:var(--mu)}
.proj-ph.on{border-color:var(--cyn);color:#e0f2fe;background:rgba(14,116,144,.25)}
.proj-ph.done{border-color:var(--grn);color:#86efac;background:rgba(16,185,129,.18)}
.proj-cfg-box{background:rgba(15,23,42,.72);border:1px solid rgba(56,189,248,.28);border-radius:14px;padding:11px;margin:8px 0 12px}
.proj-meters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.proj-meter{background:rgba(2,6,23,.55);border:1px solid rgba(148,163,184,.18);border-radius:10px;padding:6px 9px;font:700 11px var(--mono)}
.proj-meter .bar{height:6px;margin-top:4px}


/* === v20: NAV DIVIDIDO (10 TABS), ORGANIGRAMA Y TERMINAL DE HACKING === */
.nav{grid-template-columns:repeat(5,1fr);gap:2px;padding:5px 4px calc(6px + env(safe-area-inset-bottom,0px))}
.nav button{padding:4px 0 3px;font-size:9.5px}
.nav .i{font-size:17px;line-height:1.1}
.shell.in-play{padding-bottom:calc(112px + env(safe-area-inset-bottom,0px))}
.tab-overlay{padding-bottom:calc(108px + env(safe-area-inset-bottom,0px))}
@media(min-width:680px){
  .nav{grid-template-columns:repeat(10,1fr);padding:6px 5px calc(7px + env(safe-area-inset-bottom,0px))}
  .nav button{padding:5px 0 4px;font-size:10px}
  .nav .i{font-size:19px}
  .shell.in-play{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  .tab-overlay{padding-bottom:calc(82px + env(safe-area-inset-bottom,0px))}
}

/* Organigrama / Jerarquía de personas */
.org-tree{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.org-lvl{position:relative;border:1.5px solid rgba(148,163,184,.2);border-radius:14px;padding:10px 12px;background:rgba(15,23,42,.72);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.org-lvl.me{border-color:var(--gold);background:rgba(251,191,36,.10)}
.org-lvl.boss{border-color:var(--red);background:rgba(251,113,133,.09)}
.org-lvl.top{border-color:var(--vio);background:rgba(167,139,250,.10)}
.org-rank{width:28px;height:28px;border-radius:9px;background:#0a162b;border:1px solid rgba(148,163,184,.25);display:grid;place-items:center;font:800 12px var(--mono);color:var(--cyn);flex:none}
.org-av{width:40px;height:40px;border-radius:12px;background:#091326;border:1.5px solid rgba(56,189,248,.35);display:grid;place-items:center;font-size:21px;flex:none}
.org-info{flex:1;min-width:150px}
.org-info b{display:block;font:700 14px/1.2 var(--hd);color:#f8fafc}
.org-info small{display:block;font:600 11.5px "Nunito";color:var(--mu)}
.org-rel{width:96px;flex:none}
.org-rel .bar{height:6px;margin-top:3px}
.org-acts{display:flex;gap:5px;flex-wrap:wrap}

/* Terminal de Hacking */
.hk-term{background:linear-gradient(180deg,#061310,#040b0e);border:1.5px solid rgba(46,230,107,.45);border-radius:16px;padding:13px;margin-bottom:12px;box-shadow:0 0 26px rgba(46,230,107,.10)}
.hk-term h3{color:#4ade80}
.hk-ops-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;margin-top:10px}
.hk-op{background:rgba(7,22,20,.88);border:1.5px solid rgba(46,230,107,.28);border-radius:14px;padding:11px;display:flex;flex-direction:column;gap:6px}
.hk-op:hover{border-color:rgba(46,230,107,.65)}
.hk-op b{color:#e2fce9;font:700 14px var(--hd)}
.hk-op .btn{background:linear-gradient(180deg,#2ee66b,#16a34a);color:#032210;border-bottom-color:#15803d;font-size:13px;padding:7px 10px;margin-top:auto}
.hk-target-pill{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:11px;border:1.5px solid rgba(46,230,107,.25);background:rgba(5,16,18,.8);color:#cbd5e1;font:700 12px var(--hd);cursor:pointer}
.hk-target-pill.on{border-color:#2ee66b;background:rgba(46,230,107,.18);color:#fff;box-shadow:0 0 10px rgba(46,230,107,.22)}


/* === v21: CUARTO 3D MÁS GRANDE, ACADEMIA SEPARADA Y LAYOUT ULTRA LIMPIO === */
.gdt-topbar{
  padding:calc(6px + env(safe-area-inset-top,0px)) 10px 7px;
  background:rgba(11,18,32,.92);
  border-bottom:1px solid rgba(148,163,184,.16);
}
.gdt-top-row1{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:nowrap}
.gdt-co-id{display:flex;align-items:center;gap:7px;min-width:0;flex:1}
.gdt-av-btn{position:relative;padding:0;border:0;background:transparent;cursor:pointer;flex:none;border-radius:12px}
.gdt-av-btn .bdg{top:-4px;right:-4px;min-width:15px;height:15px;font-size:9px}
.gdt-hdr-icons{display:flex;align-items:center;gap:4px;flex:none}
.gdt-icon-btn{
  position:relative;width:32px;height:32px;border-radius:10px;
  border:1px solid rgba(148,163,184,.22);background:rgba(30,41,59,.75);
  color:#e2e8f0;display:grid;place-items:center;font-size:15px;padding:0;flex:none;
}
.gdt-icon-btn.on{border-color:var(--cyn);background:rgba(56,189,248,.2)}
.gdt-icon-btn.has{border-color:rgba(251,191,36,.6);background:rgba(251,191,36,.16)}
.gdt-top-row2{grid-template-columns:repeat(5,1fr);gap:4px;margin-top:6px}
.gdt-vital{padding:3px 6px;border-radius:9px;background:rgba(15,23,42,.72)}

.gdt-strip-scroll{

}

.iso-tag{background:rgba(8,15,30,.72);border:1px solid rgba(148,163,184,.24);font-size:10px;padding:2px 8px}

/* Panel inferior más compacto y limpio */

.gdt-news-line{

}

/* Barra inferior de 1 sola fila limpia (scrollable en móvil, 8 cols en PC) */
.nav{

}

.shell.in-play{padding-bottom:calc(68px + env(safe-area-inset-bottom,0px))}

/* === v22: HABILIDADES 1-100 PROFUNDAS Y ACADEMIA POR REQUISITOS === */
.sk-meter-card{background:rgba(15,23,42,.72);border:1px solid rgba(148,163,184,.18);border-radius:13px;padding:9px 11px;margin-bottom:8px}
.sk-meter-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:5px;flex-wrap:wrap}
.sk-meter-name{font:700 13.5px var(--hd);color:#f8fafc;display:flex;align-items:center;gap:6px}
.sk-tier-tag{font:700 9.5px var(--mono);padding:1px 7px;border-radius:99px;background:rgba(56,189,248,.14);border:1px solid rgba(56,189,248,.35);color:#7dd3fc}
.sk-meter-val{font:800 13px var(--mono);color:var(--gold)}
.sk-meter-bar{height:9px;border-radius:99px;background:#070e1c;border:1px solid rgba(148,163,184,.18);overflow:hidden;margin-bottom:6px}
.sk-meter-bar i{display:block;height:100%;border-radius:99px;transition:width .35s ease}
.sk-meter-foot{display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap}
.sk-mini-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin:8px 0 10px}
@media(min-width:560px){.sk-mini-strip{grid-template-columns:repeat(6,1fr)}}
.sk-mini-pill{background:rgba(15,23,42,.82);border:1px solid rgba(148,163,184,.2);border-radius:10px;padding:5px 7px;text-align:center;font:700 11px var(--mono)}
.sk-mini-pill b{display:block;font-size:13px;color:var(--gold)}
.req-list{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0}
.req-pill{font:700 10px var(--mono);padding:2px 7px;border-radius:99px;border:1px solid}
.req-pill.ok{background:rgba(16,185,129,.14);border-color:rgba(52,211,153,.4);color:#86efac}
.req-pill.no{background:rgba(244,63,94,.14);border-color:rgba(251,113,133,.4);color:#fda4af}
.pm.wide{width:auto;padding:0 9px;font-size:12px}


/* === v24: MINIJUEGOS FLUIDOS 60FPS SIN RECARGA + 5 NUEVOS DINÁMICOS === */
.mg-stage{position:relative;min-height:205px;transition:none}
.mg-pop-out{transform:scale(.45)!important;opacity:0!important;pointer-events:none;transition:transform .16s ease,opacity .16s ease!important}
.mg-shake{animation:mgHitShake .22s ease}
@keyframes mgHitShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.mg-hud-row{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;width:100%}
.mg-badge{font:700 11.5px var(--mono);padding:3px 10px;border-radius:99px;background:rgba(15,23,42,.85);border:1px solid rgba(56,189,248,.4);color:#e2e8f0}
.mg-badge.warn{border-color:var(--red);color:#fda4af;background:rgba(136,19,55,.35)}
.mg-badge.ok{border-color:var(--grn);color:#86efac;background:rgba(6,78,59,.35)}

/* Timing Bar (Estabilizar Wi-Fi) */
.mg-track{position:relative;width:100%;max-width:320px;height:28px;border-radius:99px;background:#050c1d;border:2px solid rgba(148,163,184,.3);overflow:hidden}
.mg-zone{position:absolute;top:0;bottom:0;background:linear-gradient(90deg,rgba(16,185,129,.35),rgba(52,211,153,.75),rgba(16,185,129,.35));border-left:2px solid #34d399;border-right:2px solid #34d399;transition:left .2s ease,width .2s ease}
.mg-cursor{position:absolute;top:-2px;bottom:-2px;width:8px;margin-left:-4px;border-radius:4px;background:#fff;box-shadow:0 0 12px #38bdf8,0 0 4px #fff;will-change:left}

/* Firewall 3x3 Reflex Grid */
.mg-fw-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;max-width:290px}
.mg-fw-cell{aspect-ratio:1/1;border-radius:13px;border:1.5px solid rgba(148,163,184,.22);background:rgba(15,23,42,.8);display:flex;flex-direction:column;align-items:center;justify-content:center;font:700 11px var(--mono);color:var(--mu);transition:transform .08s,background .12s,border-color .12s}
.mg-fw-cell:active{transform:scale(.92)}
.mg-fw-cell.bad{background:rgba(190,18,60,.32);border-color:#fb7185;color:#fecdd3;box-shadow:0 0 14px rgba(251,113,133,.28)}
.mg-fw-cell.good{background:rgba(6,95,70,.28);border-color:#34d399;color:#a7f3d0}
.mg-fw-cell .fi{font-size:24px;line-height:1.1}

/* Patch Panel Cables */
.mg-cable-wrap{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:100%;max-width:320px}
.mg-cable-col{display:flex;flex-direction:column;gap:8px}
.mg-port{display:flex;align-items:center;justify-content:center;gap:6px;padding:10px 8px;border-radius:11px;border:2px solid rgba(148,163,184,.28);background:rgba(15,23,42,.85);font:700 12px var(--mono);color:#fff;transition:transform .08s,box-shadow .12s,opacity .15s}
.mg-port.sel{box-shadow:0 0 0 3px #fff;transform:scale(1.03)}
.mg-port.done{opacity:.42;border-style:dashed;pointer-events:none}

/* Simon Says LEDs */
.mg-simon-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;width:100%;max-width:240px}
.mg-led{height:70px;border-radius:15px;border:2px solid rgba(255,255,255,.18);font:800 22px var(--hd);opacity:.55;transition:opacity .12s,transform .1s,box-shadow .12s}
.mg-led.lit{opacity:1;transform:scale(1.05);box-shadow:0 0 24px currentColor}
.mg-led:active{transform:scale(.94)}

/* Thermal Cooldown */
.mg-therm-bar{width:100%;max-width:300px;height:22px;border-radius:99px;background:#050c1d;border:2px solid rgba(148,163,184,.3);overflow:hidden}
.mg-therm-bar i{display:block;height:100%;transition:width .08s linear,background .15s}


/* === v25: MUÑECOS MEJORADOS, JERARQUÍA PROFUNDA, HACKING RIVAL Y CANDIDATURAS === */
@keyframes gdtBlink{0%,92%,100%{transform:scaleY(1)}95%,97%{transform:scaleY(0.1)}}
.anim-blink{transform-box:fill-box;transform-origin:center;animation:gdtBlink 4.2s infinite}
@keyframes gdtMoodFloat{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-4px) scale(1.06)}}
.anim-mood{animation:gdtMoodFloat 2.4s ease-in-out infinite}
.org-locked{

}

.apply-pill{display:inline-flex;align-items:center;gap:5px;font:700 11px var(--mono);padding:4px 9px;border-radius:9px;border:1px solid rgba(52,211,153,.4);background:rgba(16,185,129,.16);color:#86efac}
.apply-pill.mid{border-color:rgba(251,191,36,.45);background:rgba(251,191,36,.15);color:#fde68a}
.apply-pill.lo{border-color:rgba(251,113,133,.4);background:rgba(244,63,94,.14);color:#fda4af}
.hk-log-box{background:rgba(2,6,23,.55);border:1px solid rgba(46,230,107,.25);border-radius:12px;padding:9px 11px;margin-top:10px;font-size:12px}
.hk-log-item{padding:4px 0;border-bottom:1px dashed rgba(148,163,184,.12);color:#cbd5e1}
.hk-log-item:last-child{border-bottom:0}


/* === v26: CERO RECARGAS EN PESTAÑAS, HACKING LIMPIO Y SISTEMA DE ÉTICA === */
.tab-scroll .card{animation:none!important}
.hk-shell{background:linear-gradient(180deg,#081514,#060d14);border:1px solid rgba(52,211,153,.35);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:12px}

.hk-target-strip{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}

.hk-op-card{background:rgba(11,22,30,.92);border:1px solid rgba(148,163,184,.2);border-radius:13px;padding:11px;display:flex;flex-direction:column;gap:6px;transition:border-color .15s}

.hk-op-hd{display:flex;justify-content:space-between;align-items:flex-start;gap:6px}

.hk-pct{font:800 11px var(--mono);padding:2px 7px;border-radius:99px;background:rgba(15,23,42,.9);border:1px solid;flex:none}
.hk-meta{display:flex;gap:8px;flex-wrap:wrap;font:700 10.5px var(--mono);color:var(--mu)}
.eth-bar-wrap{background:rgba(15,23,42,.75);border:1px solid rgba(148,163,184,.2);border-radius:14px;padding:11px 12px;margin:0 0 12px}
.eth-track{position:relative;height:10px;border-radius:99px;background:linear-gradient(90deg,#ef4444 0%,#f59e0b 35%,#38bdf8 65%,#34d399 100%);margin:7px 0}
.eth-pin{position:absolute;top:-4px;width:10px;height:18px;margin-left:-5px;border-radius:4px;background:#fff;border:2px solid #0f172a;box-shadow:0 0 8px #000}


/* === v27: REDISEÑO DRÁSTICO DE INTERFAZ, MENÚS POR CENTROS Y ESTILO SIMPSON === */
:root{
  --bg:#0a1020;--pan2:#131f38;--ln:rgba(255,217,15,.18);
  --tx:#f8fafc;--mu:#9fb2d4;
  --gold:#ffd90f;--cyn:#38bdf8;--grn:#22c55e;--red:#fb7185;--vio:#a78bfa;--org:#fb923c;
}
body{
  background:
    radial-gradient(circle at 85% 0%,rgba(255,217,15,.12),transparent 42%),
    radial-gradient(circle at 12% 100%,rgba(56,189,248,.14),transparent 48%),
    linear-gradient(180deg,#0c1528 0%,#070d1a 100%);
}
.shell.in-play{background:transparent;padding-bottom:calc(82px + env(safe-area-inset-bottom,0px))}

/* HUD Superior Rediseñado: Compacto, Claro y Premium */
.gdt-topbar{
  background:rgba(10,17,34,.94);
  border-bottom:2px solid rgba(255,217,15,.26);
  padding:calc(7px + env(safe-area-inset-top,0px)) 12px 8px;
  box-shadow:0 10px 28px rgba(0,0,0,.45);
}
.gdt-top-row1{gap:10px}
.gdt-co-id .avb{border:2.5px solid var(--gold)!important;box-shadow:0 2px 0 #111!important;background:#ffd90f}
.gdt-co-txt b{font:700 15.5px/1.15 var(--hd);color:#fff;letter-spacing:.01em}
.gdt-co-txt small{color:#fde047;font:700 10.5px var(--mono)}
.gdt-icon-btn{
  width:34px;height:34px;border-radius:11px;
  background:rgba(24,38,68,.9);border:1.5px solid rgba(148,163,184,.28);
  transition:transform .1s,border-color .15s,background .15s;
}
.gdt-icon-btn:hover{border-color:var(--gold);background:rgba(36,56,96,.95)}
.gdt-top-row2{gap:5px;margin-top:7px}
.gdt-vital{
  background:rgba(13,22,42,.88);border:1.5px solid rgba(148,163,184,.2);
  border-radius:11px;padding:4px 7px;
}
.gdt-vital .bar{height:5px;border-radius:99px;background:#050a14}
.gdt-pill{
  font:700 10.5px var(--mono);padding:3px 9px;border-radius:99px;
  background:rgba(19,31,56,.9);border:1px solid rgba(148,163,184,.24);
}

/* Tarjetas estilo Comic-Tech limpio */
.card{
  background:linear-gradient(180deg,#152340,#0f1a31);
  border:1.5px solid rgba(148,163,184,.24);
  border-radius:20px;
  box-shadow:0 12px 30px rgba(0,0,0,.38),0 3px 0 rgba(0,0,0,.45);
}
.card.star{border-color:rgba(255,217,15,.65)}
.wb{
  background:#0a1326;border-bottom:1.5px solid rgba(148,163,184,.16);
  padding:8px 14px;font:700 10.5px var(--mono);letter-spacing:.04em;text-transform:uppercase;color:#93c5fd;
}

/* Botones más táctiles y legibles */
.btn{
  border-radius:14px;font-weight:700;letter-spacing:.01em;
  background:linear-gradient(180deg,#4ade80,#16a34a);color:#032210;
  border:1.5px solid #14532d;border-bottom-width:4px;
}
.btn.y{
  background:linear-gradient(180deg,#ffe44d,#f59e0b);color:#3b1e00;
  border:1.5px solid #78350f;border-bottom-width:4px;
}
.gh{
  border-radius:12px;border:1.5px solid rgba(148,163,184,.28);border-bottom-width:3px;
  background:rgba(22,35,62,.85);color:#e2e8f0;
}
.gh.on{border-color:var(--gold);background:rgba(255,217,15,.16);color:#fef08a}

/* Barra Inferior Flotante de 5 Centros (Sin Scroll Horizontal, 100% Accesible) */
.nav{
  display:grid!important;grid-template-columns:repeat(5,1fr)!important;
  overflow:visible!important;gap:5px!important;
  left:50%!important;transform:translateX(-50%)!important;
  bottom:calc(8px + env(safe-area-inset-bottom,0px))!important;
  width:min(760px,calc(100% - 16px))!important;
  padding:6px 7px!important;
  background:rgba(10,18,36,.95)!important;
  border:1.5px solid rgba(255,217,15,.32)!important;
  border-radius:20px!important;
  box-shadow:0 14px 36px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,255,255,.08)!important;

}
.nav button{
  flex:auto!important;padding:6px 2px 5px!important;
  font:700 10.5px var(--hd)!important;border-radius:14px!important;
  color:#94a3b8!important;transition:background .15s,color .15s,transform .1s!important;
}
.nav .i{font-size:20px!important;line-height:1.15!important;margin-bottom:1px}
.nav button.on{
  color:#0a1020!important;
  background:linear-gradient(180deg,#ffe44d,#f59e0b)!important;
  box-shadow:0 3px 12px rgba(255,217,15,.32)!important;
}
.nav button.on .i{transform:scale(1.08)}
.nav .bdg{
  top:2px!important;right:12%!important;
  background:#ef4444!important;color:#fff!important;
  border:1.5px solid #0a1224!important;
}

/* Cabecera de Centro (Hub) con Sub-pestañas Segmentadas */
.tab-overlay{
  background:rgba(5,10,22,.88);backdrop-filter:blur(10px);
  padding:calc(8px + env(safe-area-inset-top,0px)) 10px calc(86px + env(safe-area-inset-bottom,0px));
}
.hub-header{
  flex:none;background:linear-gradient(180deg,#152546,#0d1932);

.hub-segs{

  .hub-seg{font-size:11px;padding:6px 4px}
}


/* === v28: PERSONAJES CEL-SHADED SIMPSON + CUARTO 3D VIVO === */
@keyframes gdtCloud{0%{transform:translateX(0)}100%{transform:translateX(26px)}}
@keyframes gdtBobSlow{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.2px)}}
@keyframes gdtRgb{0%,100%{opacity:.55}50%{opacity:1}}
.anim-cloud{animation:gdtCloud 11s ease-in-out infinite alternate}
.anim-bob2{animation:gdtBobSlow 1.35s ease-in-out .4s infinite}
.anim-rgb{animation:gdtRgb 2.1s ease-in-out infinite}


/* === v29: ASISTENTE DE CREACIÓN PASO A PASO === */
.wiz-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:14px}
.wiz-step{
  background:rgba(15,23,42,.82);border:1.5px solid rgba(148,163,184,.2);border-radius:13px;
  padding:8px 6px;text-align:center;color:var(--mu);font:700 11px var(--hd);
  display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;
  transition:border-color .15s,background .15s,color .15s;

let actx=null,mgTimer=null,mgRaf=null;
const muted=()=>ls('wi_mute')==='1';
function sfx(k){
  if(muted())return;
  try{
    actx=actx||new(window.AudioContext||window.webkitAudioContext)();
    if(actx.state==='suspended')actx.resume();
    const t=actx.currentTime,o=actx.createOscillator(),gn=actx.createGain();
    o.connect(gn);gn.connect(actx.destination);
    if(k==='tap'){o.type='triangle';o.frequency.setValueAtTime(520,t);gn.gain.setValueAtTime(.06,t);gn.gain.exponentialRampToValueAtTime(.001,t+.06);o.start(t);o.stop(t+.06)}
    else if(k==='coin'){o.type='sine';o.frequency.setValueAtTime(987,t);o.frequency.setValueAtTime(1318,t+.07);gn.gain.setValueAtTime(.08,t);gn.gain.exponentialRampToValueAtTime(.001,t+.22);o.start(t);o.stop(t+.22)}
    else if(k==='ok'){o.type='sine';o.frequency.setValueAtTime(523,t);o.frequency.setValueAtTime(659,t+.08);o.frequency.setValueAtTime(784,t+.16);gn.gain.setValueAtTime(.09,t);gn.gain.exponentialRampToValueAtTime(.001,t+.3);o.start(t);o.stop(t+.3)}
    else if(k==='bad'){o.type='sawtooth';o.frequency.setValueAtTime(220,t);o.frequency.linearRampToValueAtTime(140,t+.24);gn.gain.setValueAtTime(.07,t);gn.gain.exponentialRampToValueAtTime(.001,t+.25);o.start(t);o.stop(t+.25)}
    else if(k==='offer'){o.type='sine';o.frequency.setValueAtTime(587,t);o.frequency.setValueAtTime(880,t+.1);o.frequency.setValueAtTime(1174,t+.2);gn.gain.setValueAtTime(.08,t);gn.gain.exponentialRampToValueAtTime(.001,t+.34);o.start(t);o.stop(t+.34)}
  }catch(e){}
}
function buzz(ms=25){try{if(navigator.vibrate)navigator.vibrate(ms)}catch(e){}}
function toast(msg){
  const old=document.querySelector('.toast');if(old)old.remove();
  const el=document.createElement('div');el.className='toast';el.textContent=msg;
  document.body.appendChild(el);setTimeout(()=>el.remove(),2900);
}

/* Guardado resiliente (localStorage + fallback en memoria para file:// o modo privado) */
const _memLS={};
const ls=(k,v)=>{
  if(v===undefined){
    try{const val=localStorage.getItem(k);if(val!==null)return val;}catch(e){}
    return Object.prototype.hasOwnProperty.call(_memLS,k)?_memLS[k]:null;
  }
  if(v===null){
    delete _memLS[k];
    try{localStorage.removeItem(k);}catch(e){}
  }else{
    _memLS[k]=String(v);
    try{localStorage.setItem(k,String(v));}catch(e){}
  }
};

function ensureEmpProjFields(){
  if(!g)return;
  if(!g.coUpgrades||typeof g.coUpgrades!=='object')g.coUpgrades={};
  if(g.empProj&&!EMP_PROJECTS.some(p=>p.id===g.empProj.id))g.empProj=null;
  if(g.empProj&&g.empProj.co!==g.co)g.empProj=null;
}
function coDoneProjs(cKey){
  if(!g)return [];
  ensureEmpProjFields();
  return g.coUpgrades[cKey||g.co]||[];
}
function coUpgradeBonuses(cKey){
  const ids=coDoneProjs(cKey);
  let salPct=0,burnRed=0;
  ids.forEach(id=>{
    const p=EMP_PROJECTS.find(x=>x.id===id);
    if(p){salPct+=p.salPct||0;burnRed+=p.burnRed||0;}
  });
  return {salPct,burnRed,count:ids.length};
}
function empProjSpeed(p){
  if(!g||!p)return 18;
  const mainAt=attr(p.area||'tec');
  const secAt=attr('sys')*0.25+attr('com')*0.2;
  return Math.max(16,Math.round(12 + mainAt*0.42 + secAt + g.rank*4));
}
function startEmpProject(id){
  if(!g||g.startup)return;
  ensureEmpProjFields();
  const p=EMP_PROJECTS.find(x=>x.id===id);
  if(!p||g.empProj||coDoneProjs(g.co).includes(id)||g.rank<p.minRank)return;
  g.empProj={id:p.id,co:g.co,prog:0,boostTurn:-1};
  sfx('ok');buzz(20);
  addNews('🛠️',`${g.name} lidera el proyecto interno «${p.n}» en ${co().n}.`,1);
  toast(`🛠️ Proyecto iniciado: ${p.n}`);
  save();render();
}
function boostEmpProject(){
  if(!g||g.startup||!g.empProj)return;
  if(g.empProj.boostTurn===g.turn){toast('Ya impulsaste el proyecto esta semana');return;}
  const p=EMP_PROJECTS.find(x=>x.id===g.empProj.id);
  if(!p)return;
  const add=Math.round(empProjSpeed(p)*0.75);
  g.empProj.prog=Math.min(p.effort,g.empProj.prog+add);
  g.empProj.boostTurn=g.turn;
  g.C.burn=Math.min(100,g.C.burn+5);
  g.st[1]=clamp(g.st[1]-2);
  sfx('tap');buzz(18);
  if(g.empProj.prog>=p.effort){
    completeEmpProject(p);
  }else{
    toast(`⚡ Sprint extra: +${add} pts (${Math.round(g.empProj.prog/p.effort*100)}%)`);
  }
  save();render();
}
function completeEmpProject(p){
  if(!g||!p)return;
  ensureEmpProjFields();
  const ck=g.co;
  g.coUpgrades[ck]=g.coUpgrades[ck]||[];
  if(!g.coUpgrades[ck].includes(p.id))g.coUpgrades[ck].push(p.id);
  g.empProj=null;
  g.st[0]=f1(g.st[0]+p.bonus);
  g.st[2]=clamp(g.st[2]+p.rep);
  g.imp=Math.max(0,g.imp+p.imp);
  g.C.dt=Math.max(0,g.C.dt-p.dtCut);
  addXp(45+p.minRank*20);
  const rivObj=RIVAL_CORPS.find(r=>r.k===ck);
  let valAddTxt='';
  if(rivObj){
    const curV=getRivalVal(rivObj);
    const gainV=Math.max(15,Math.round(curV*(p.valPct||0.10)));
    g.rivalVals[ck]=curV+gainV;

function suUpgradeVal(k){

function getAvailableProjects(){
  if(!g||!g.startup)return [];
  ensureStartupFields();
  const s=g.startup;
  // Determine max unlocked project tier based on company valuation & completed projects
  let maxTier=1;
  if(s.val>=350||s.doneProjs.length>=2)maxTier=2;
  if(s.val>=1800||s.doneProjs.length>=5)maxTier=3;
  if(s.val>=9000||s.doneProjs.length>=9)maxTier=4;

  // Uncompleted projects up to maxTier
  let avail=STARTUP_PROJECTS.filter(p=>p.tier<=maxTier && !s.doneProjs.includes(p.id));
  // If player already completed all projects up to maxTier, renew Tier 4 (or highest unlocked) contracts with a new cycle!
  if(avail.length<4){
    const renewable=STARTUP_PROJECTS.filter(p=>p.tier===maxTier).map(p=>({
      ...p,
      id:p.id+'_r'+(s.projCycle+1),
      baseId:p.id,
      n:`${p.n} v${s.projCycle+2}.0`,
      cost:Math.round(p.cost*(1+s.projCycle*0.25)),
      effort:Math.round(p.effort*(1+s.projCycle*0.2)),
      cash:Math.round(p.cash*(1+s.projCycle*0.3)),
      val:Math.round(p.val*(1+s.projCycle*0.35)),
      mrr:f1(p.mrr*(1+s.projCycle*0.25))
    }));
    avail=[...avail,...renewable];
  }
  // Rotate window of 8 projects based on projCycle
  const offset=(s.projCycle*2)%Math.max(1,avail.length);
  const rotated=[...avail.slice(offset),...avail.slice(0,offset)];
  return rotated.slice(0,8);
}

function suProjWeeklySpeed(proj){

function addNews(ic,h,me){
  if(!g)return;
  g.news=g.news||[];
  g.news.unshift({ic,h,me:!!me,a:AGE()});
  if(me&&['🎉','🔁','🆕','🎓','🏠','🏅'].includes(ic)){g.cv=g.cv||[];g.cv.unshift({ic,h,a:AGE()});if(g.cv.length>30)g.cv.length=30}
  if(g.news.length>35)g.news.length=35;
}
function worldNews(){
  if(!g||Math.random()>0.25)return;
  const recent=new Set(g.news.slice(0,5).map(n=>n.h));
  const cand=WN.filter(w=>!recent.has(w[1]));
  if(!cand.length)return;
  const w=pick(cand);
  addNews(w[0],w[1],0);
}
function mkNews(o,op,roll,dl,promo){
  if(promo){
    const h=`${g.name} asciende a ${promo} en ${co().n}`;
    g.st[2]=clamp(g.st[2]+3);g.st[3]=clamp(g.st[3]+2);
    addNews('🎉',h,1);
    return {h,p:1};
  }
  if((roll&&roll.ok&&(op.m>=2||g.st[2]>=55||Math.random()<0.35))||o[3]==='iaentrenada'){
    const feat=DEV[g.dev%DEV.length];g.dev++;
    const h=`${g.name} (${co().n}) publica ${feat}`;
    g.st[2]=clamp(g.st[2]+3);g.st[3]=clamp(g.st[3]+2);
    addNews('📰',h,1);
    return {h,p:1};
  }
  if(roll&&!roll.ok&&dl[2]<=-6){
    const h=`Incidente sonado en ${co().n}: ${g.name} protagoniza un despliegue inolvidable`;
    addNews('💥',h,1);
    return {h,p:0};
  }
  if(dl[4]<=-6){
    const h=`Polémica interna en ${co().n} tras una decisión de ${g.name}`;
    addNews('🗞️',h,1);
    return {h,p:0};
  }
  return null;
}
function rollOffer(){
  if(g.startup){g.offers=[];return;}
  g.offers=(g.offers||[]).filter(o=>(g.turn-o.at)<7);
  if(g.offers.length>=3||g.turn<=3)return;
  // Frecuencia moderada y progresiva: ~8% inicial hasta ~22% según avance
  let prob=0.08+g.rank*0.018;
  if(g.st[2]>=45)prob+=0.03;
  if(g.st[2]>=70)prob+=0.025;
  if(g.st[3]>=25)prob+=0.025;
  prob+=Math.min(g.dev,4)*0.01;
  if(g.runMod&&g.runMod.id==='hr_friend')prob+=0.06;
  if(g.world&&(g.world.id==='ipo_mania'||g.world.id==='boom'))prob+=0.06;
  prob=Math.min(0.32,prob);
  if(Math.random()>=prob)return;

  const existing=new Set(g.offers.map(o=>o.co));
  const pool=targets(true).filter(k=>!existing.has(k));
  if(!pool.length)return;
  const cKey=pick(pool),tc=CO[cKey];
  let offRank=g.rank;
  if(tc.tier>co().tier)offRank=Math.max(0,g.rank-1);
  else if(tc.tier<co().tier)offRank=Math.min(5,g.rank+1);
  else if(Math.random()<0.35)offRank=Math.min(5,g.rank+1);

  const bonus=2+Math.floor(Math.random()*5)+tc.tier*2;
  g.offers.push({co:cKey,rank:offRank,bonus,at:g.turn});
  addNews('📩',`Cazatalentos de ${tc.n} contactan con ${g.name}`,1);
  sfx('offer');
  pushBigAlert({
    tag:'📩 NUEVA OFERTA LABORAL',
    logoHtml:brandLogo(cKey,40),
    title:`${tc.n} quiere ficharte`,
    desc:`Puesto: <b>${tc.lad[offRank]}</b> · Sueldo: <b>${tc.sal[offRank]} k€/mes</b> · Bono: <b>+${bonus} k€</b>`,
    color:'#38bdf8',
    action:{label:'📩 Ir a la oferta →',a:'go_offers',v:''}
  });
}

function gainLevel(m){g.lvl++;g.apts+=4;if(g.lvl%2===0)g.tp++;const bonus=f1(g.lvl*.4);g.st[0]=f1(g.st[0]+bonus);g.C.burn=Math.max(0,g.C.burn-10);sfx('coin');
 pushBigAlert({tag:'⭐ SUBES DE NIVEL',icon:'🌟',title:'Nivel '+g.lvl,desc:'+4 puntos de habilidad'+(g.lvl%2===0?' · +1 punto de talento':'')+' · +'+bonus+' k€ · −10 de burnout',color:'#ffc83d'});m.lv=g.lvl}
function addXp(n,m){g.xp+=n;m=m||{};while(g.xp>=xpNeed()){g.xp-=xpNeed();gainLevel(m)}return m}
function checkAch(){const out=[];g.ach=g.ach||[];LOGROS.forEach(a=>{if(g.ach.includes(a.id))return;let ok=false;try{ok=!!a.f()}catch(e){}if(!ok)return;g.ach.push(a.id);if(a.k)g.st[0]=f1(g.st[0]+a.k);if(a.tp)g.tp+=a.tp;out.push(a);toast('🏆 Logro: '+a.n)});
 out.forEach(a=>{if(a.xp)addXp(a.xp)});return out}
function progressStep(dl,roll,promo){g.streak=g.streak||0;g.best=g.best||0;const good=roll?roll.ok:(dl[2]>=2||dl[1]>=2);
 if(good)g.streak++;else if(roll&&!roll.ok||dl[2]<0||dl[1]<-3)g.streak=0;if(g.streak>g.best)g.best=g.streak;
 let gain=8+2*Math.max(0,dl[2])+Math.max(0,dl[3])+(roll?(roll.ok?8:2):0)+Math.min(10,g.streak)+(promo?80:0);
 if([3,5,10,15,20].includes(g.streak)){gain+=g.streak;toast('🔥 Racha de '+g.streak+'!')}
 gain=Math.round(gain*(1+effSum('xp_bo')+(g.runMod&&g.runMod.id==='cursed'?.2:0)+(g.world&&g.world.id==='sec_crisis'?.2:0)));const m=addXp(gain,{});const ach=checkAch();return{gain,lv:m.lv||0,ach}}

let simTimer=null;
let ntfTimer=null;
function scheduleNtfHide(){
  if(ntfTimer){clearTimeout(ntfTimer);ntfTimer=null;}
  if(ui.bigAlerts&&ui.bigAlerts.length){
    ntfTimer=setTimeout(()=>{
      if(ui.bigAlerts&&ui.bigAlerts.length){
        ui.bigAlerts.shift();
        const el=document.querySelector('.ntf-banner');
        if(el)el.remove();
        if(ui.bigAlerts.length)render();
      }
    },5200);
  }
}
function pushBigAlert(a){
  ui.bigAlerts=ui.bigAlerts||[];
  ui.ntfLog=ui.ntfLog||[];
  const item={...a,at:g?AGE_TXT():''};
  ui.ntfLog.unshift(item);
  if(ui.ntfLog.length>20)ui.ntfLog.length=20;
  ui.ntfUnread=(ui.ntfUnread||0)+1;
  // Evitar saturar: máximo 2 avisos activos en banner; el resto queda en la campana 🔔
  if(ui.bigAlerts.length<2)ui.bigAlerts.push(item);
  scheduleNtfHide();
}

      <div class="row" style="gap:6px">

        <button class="gh" style="padding:3px 9px;font-size:11px" data-a="dismiss_alert">Entendido</button>

function getSedeInfo(){
  if(!g)return {key:'sop',sede:'Cuarto de Soporte',loc:'Inicio',lvl:1,bg1:'#1d263b',bg2:'#0f1524',fl1:'#28324a',fl2:'#1e2638',accent:'#38bdf8',desk:'#92400e',deskTop:'#d97706',floor:'carpet',decor:'helpdesk'};
  if(g.startup){
    const v=g.startup.val;
    if(v>=100000)return {key:'startup',sede:`Torre Global ${g.startup.name}`,loc:'Rascacielos propio · Gigante Tech',lvl:4,bg1:'#4a3210',bg2:'#211505',fl1:'#593e18',fl2:'#422d10',accent:'#fbbf24',desk:'#78350f',deskTop:'#f59e0b',floor:'wood',decor:'bigtech'};
    if(v>=15000)return {key:'startup',sede:`Campus Unicornio ${g.startup.name}`,loc:'Sede tecnológica propia · Serie C',lvl:3,bg1:'#0f4c5c',bg2:'#072730',fl1:'#185e70',fl2:'#114757',accent:'#2dd4bf',desk:'#1e293b',deskTop:'#f8fafc',floor:'wood',decor:'bigtech'};
    if(v>=1500)return {key:'startup',sede:`Oficinas ${g.startup.name} (Serie A)`,loc:'Planta moderna · Equipo en expansión',lvl:2,bg1:'#1e3a6e',bg2:'#112347',fl1:'#2b4a82',fl2:'#213b6b',accent:'#38bdf8',desk:'#334155',deskTop:'#e2e8f0',floor:'carpet',decor:'startup'};
    return {key:'startup',sede:`Garaje / Loft ${g.startup.name}`,loc:'Sede Seed · Donde nacen los unicornios',lvl:1,bg1:'#3b1e5e',bg2:'#1c0e33',fl1:'#472770',fl2:'#351c57',accent:'#f472b6',desk:'#6d28d9',deskTop:'#c084fc',floor:'wood',decor:'startup'};
  }
  const k=g.co||'sop';
  const pt=PLACE_THEMES[k]||PLACE_THEMES.sop;
  return {key:k,...pt,lvl:1+Math.floor(g.rank/2)};
}

function checkSedeUpgrade(silent){
  if(!g)return;
  const sd=getSedeInfo();
  const sig=sd.sede;
  if(!g.lastSedeSig)g.lastSedeSig=sig;
  if(sig!==g.lastSedeSig){
    g.lastSedeSig=sig;
    addNews('🏢',`¡Nueva sede! ${g.name} se traslada a: ${sd.sede} (${sd.loc})`,1);
    if(!silent){
      pushBigAlert({
        tag:'🏢 CAMBIO DE SEDE',
        logoHtml:brandLogo(sd.key,78,g.startup?g.startup.ic:'🏢'),
        title:sd.sede,
        desc:`Tu puesto de trabajo cambia a una nueva sede: <b>${sd.loc}</b>.<br>¡Observa cómo se ha transformado tu cuarto!`,
        color:sd.accent||'#2fd4ff'
      });
    }
  }
}

/* Spawner de burbujas flotantes en tiempo real (estilo Game Dev Tycoon) */
function spawnRoomBubble(txt,col='#38bdf8',xPct=null,yPct=null){
  const layer=$('gdt-particles');
  if(!layer)return;
  if(layer.children.length>=2)layer.firstChild.remove();
  const el=document.createElement('div');
  el.className='gdt-pop-bubble';
  el.textContent=txt;
  el.style.borderColor=col;
  el.style.color=col;
  const lx=xPct!==null?xPct:(38+Math.random()*24);
  const ly=yPct!==null?yPct:(20+Math.random()*16);
  el.style.left=lx+'%';
  el.style.top=ly+'%';
  layer.appendChild(el);
  setTimeout(()=>el.remove(),1850);
}

function burstOutcomeBubbles(dl){
  if(!dl)return;
  const parts=dl.map((val,i)=>val?`${V[i][1]}${val>0?'+':''}${val}`:'').filter(Boolean);
  if(parts.length){
    spawnRoomBubble(parts.slice(0,3).join(' · '),'#34d399',50,46);
  }
}

function syncSimLoop(){
  if(simTimer){clearInterval(simTimer);simTimer=null;}
  if(!g||ui.scr!=='play'||ui.tab!=='work'||ui.ticketOpen)return;
  if(ui.simSpd===undefined)ui.simSpd=1;
  if(ui.simProg===undefined)ui.simProg=0;
  if(ui.simSpd<=0)return;
  simTimer=setInterval(()=>{
    if(!g||ui.scr!=='play'||ui.tab!=='work'||ui.ticketOpen){
      clearInterval(simTimer);simTimer=null;return;
    }
    const step=ui.simSpd===2?4.5:2;
    ui.simProg=Math.min(100,(ui.simProg||0)+step);
    const barEl=$('gdt-sim-fill');
    if(barEl)barEl.style.width=ui.simProg+'%';
    const pctEl=$('gdt-sim-pct');
    if(pctEl)pctEl.textContent=Math.round(ui.simProg)+'%';
    if(Math.random()<0.14){
      const pool=g.startup
        ?[['💻 +Código','#38bdf8'],['🚀 +Producto','#ffc83d'],['📈 +Usuarios','#2ee66b'],['☁️ +Escala','#a78bfa']]
        :[['💻 +Código','#38bdf8'],['🔧 +Soporte','#2dd4bf'],['⭐ +Impacto','#fbbf24'],['🧠 +Know-how','#a78bfa'],['☁️ +Sistemas','#60a5fa']];
      const b=pick(pool);
      spawnRoomBubble(b[0],b[1]);
    }
    if(ui.simProg>=100){
      clearInterval(simTimer);simTimer=null;
      triggerIncomingTicket();
    }
  },260);
}

  const nose=`<path d="M48 47Q56 46 55 52Q54 55 47 53" fill="${k}" stroke="${ink}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>`;
