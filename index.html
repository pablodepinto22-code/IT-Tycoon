function launchCyberAttack(atkId){
  if(!g||!g.startup)return;
  ensureStartupFields();
  if(!g.startup.hackerDept)return;
  const atk=HACKER_ATTACKS.find(x=>x.id===atkId);
  const rivals=startupRankList().filter(x=>!x.me);
  if(!atk||!rivals.length||g.st[0]<atk.cost)return;

  const targetKey=ui.hkTarget&&rivals.some(r=>r.k===ui.hkTarget)?ui.hkTarget:rivals[0].k;
  const target=rivals.find(r=>r.k===targetKey);
  const hkSt=suHackerStats();
  const pwrMult=1 + (hkSt.atk*0.035) + suUpgradeVal('hack_power') + effSum('hk_bo');
  const stlMult=Math.max(0.40, 1 - (hkSt.stl*0.025) - suUpgradeVal('hack_stealth') - effSum('hk_bo')*0.5);

  g.st[0]=f1(g.st[0]-atk.cost);
  g.st[4]=clamp(g.st[4]-4);
  const heatGain=Math.max(4,Math.round(atk.heat*stlMult));
  g.startup.heat=Math.min(100,g.startup.heat+heatGain);

  // Check if Interpol / Cyberpolice raid triggers!
  if(g.startup.heat>=90 && Math.random()<0.55){
    const fine=Math.max(15,Math.round(g.st[0]*0.30));
    g.st[0]=f1(g.st[0]-fine);
    g.st[2]=clamp(g.st[2]-12);
    g.startup.heat=35;
    sfx('bad');buzz(80);
    addNews('🚨',`¡Redada policial! Agentes de Ciberdelitos incautan servidores vinculados a ${g.startup.name}. Multa de −${fine} k€.`,1);
    pushBigAlert({
      tag:'🚨 ALERTA MÁXIMA · REDADA POLICIAL',
      icon:'🚓',
      title:'¡Rastro Interceptado!',
      desc:`Tu nivel de sospecha alcanzó el límite crítico y la unidad de Ciberdelitos rastreó tus ataques.<br><br>💸 Multa y fianza judicial: <b>−${fine} k€</b><br>⭐ Reputación pública: <b>−12</b><br>Recuerda limpiar huellas periódicamente.`,
      color:'#ff4d6d'
    });
    save();render();return;
  }

  const prevRank=startupRankPos().pos;
  const pctDrop=Math.min(0.65,(atk.dmgMin + Math.random()*(atk.dmgMax-atk.dmgMin))*pwrMult);
  const curTargetVal=getRivalVal(target);
  const dropVal=Math.max(8,Math.round(curTargetVal*pctDrop));
  g.rivalVals[target.k]=Math.max(5,curTargetVal-dropVal);

  const lootCash=Math.round(atk.loot*(1+hkSt.atk*0.04));
  const valSteal=Math.round(atk.valGain*pwrMult);
  g.st[0]=f1(g.st[0]+lootCash);
  g.startup.val+=valSteal;
  g.startup.mrr=f1(g.startup.mrr+atk.mrrGain);

  if(atk.id==='sabotage' && g.startup.activeProj){
    const pObj=STARTUP_PROJECTS.find(x=>x.id===g.startup.activeProj.id);
    if(pObj){
      g.startup.activeProj.prog=Math.min(pObj.effort,g.startup.activeProj.prog+45);
      if(g.startup.activeProj.prog>=pObj.effort)completeSuProject(pObj);
    }
  }

  sfx('ok');buzz(45);
  const np=startupRankPos().pos;
  addNews('💀',`Crisis en ${target.n}: un ciberataque masivo hunde su valoración en −${fmtVal(dropVal)} (${Math.round(pctDrop*100)}%).`,1);
  pushBigAlert({
    tag:'💀 CIBERATAQUE COMPLETADO',
    logoHtml:brandLogo(target.k,76,target.ic),
    title:`¡Golpe a ${target.n}!`,
    desc:`Tus hackers han ejecutado <b>${atk.n}</b> contra <b>${target.n}</b>.<br><br>📉 Daño al rival: <b>−${fmtVal(dropVal)}</b> (−${Math.round(pctDrop*100)}%)<br>💰 Botín obtenido: <b>+${lootCash} k€</b> · 📈 Tu valoración: <b>+${fmtVal(valSteal)}</b><br>🕵️ Sospecha policial: <b>+${heatGain}%</b> (${g.startup.heat}%)${np<prevRank?`<br><br>🏆 ¡Adelantas posiciones hasta el <b>#${np} Mundial</b>!`:''}`,
    color:'#2ee66b'
  });
  checkRankMilestoneRewards();
  checkSedeUpgrade();
  save();render();
}

function startSuProject(id){
  if(!g||!g.startup)return;
  ensureStartupFields();
  const avail=getAvailableProjects();
  const base=avail.find(x=>x.id===id)||STARTUP_PROJECTS.find(x=>x.id===id);
  if(!base||g.startup.activeProj)return;
  const sc=PROJ_SCOPES.find(x=>x.id===(ui.suProjScope||'std'))||PROJ_SCOPES[1];
  const fc=ui.suProjFocus||'speed';
  const cost=f1(base.cost*sc.costM);
  if(g.st[0]<cost){toast('💶 Fondos insuficientes para este alcance');return;}
  const scaledProj={
    ...base,
    cost,
    effort:Math.round(base.effort*sc.effM),
    cash:f1(base.cash*sc.cashM),
    val:Math.round(base.val*sc.valM),
    mrr:f1(base.mrr*sc.mrrM),
    scopeName:sc.n
  };
  g.st[0]=f1(g.st[0]-cost);
  g.startup.activeProj={
    id:base.baseId||base.id,
    fullProj:scaledProj,
    prog:0,
    max:scaledProj.effort,
    scope:sc.id,
    focus:fc,
    qual:clamp(sc.qual+(fc==='qual'?16:0)),
    hype:clamp(sc.hype+(fc==='biz'?10:0))
  };
  sfx('ok');buzz(25);
  addNews('🛠️',`${g.startup.name} inicia «${base.n}» (${sc.n}).`,1);
  toast(`🛠️ Iniciado: ${base.n} (${sc.n})`);
  save();render();
}
function projTactic(kind){
  if(!g||!g.startup||!g.startup.activeProj)return;
  const ap=g.startup.activeProj;
  const pObj=ap.fullProj||STARTUP_PROJECTS.find(x=>x.id===ap.id);
  if(!pObj)return;
  if(kind==='qa'){
    if(g.st[0]<3)return;
    g.st[0]=f1(g.st[0]-3);
    ap.qual=clamp((ap.qual||60)+18);
    g.C.dt=Math.max(0,g.C.dt-5);
    ap.prog=Math.min(pObj.effort,ap.prog+16);
    sfx('ok');toast('🔍 Auditoría QA: +18% Calidad, −5 Deuda Téc. y +16 pts');
  }else if(kind==='teaser'){
    if(g.st[0]<4)return;
    g.st[0]=f1(g.st[0]-4);
    ap.hype=clamp((ap.hype||50)+22);
    g.st[2]=clamp(g.st[2]+2);
    ap.prog=Math.min(pObj.effort,ap.prog+10);
    sfx('coin');toast('📣 Campaña Teaser: +22% Hype, +2 ⭐ y +10 pts');
  }else if(kind==='crunch'){
    if(g.st[0]<4)return;
    g.st[0]=f1(g.st[0]-4);
    ap.prog=Math.min(pObj.effort,ap.prog+48);
    ap.qual=clamp((ap.qual||60)-5);
    g.C.burn=Math.min(100,g.C.burn+6);
    sfx('tap');toast('⚡ Sprint Intensivo: +48 pts (−5% Calidad, +6 🔥 Burnout)');
  }
  if(ap.prog>=pObj.effort)completeSuProject(pObj);
  save();render();
}

function execSuAction(act,val){
  if(!g||!g.startup)return;
  ensureStartupFields();
  const prevRank=startupRankPos().pos;
  if(act==='mkt'){
    if(g.st[0]<6)return;
    g.st[0]=f1(g.st[0]-6);
    g.st[2]=clamp(g.st[2]+4);g.st[3]=clamp(g.st[3]+3);
    g.startup.val+=65;
    sfx('coin');toast('📣 Campaña Growth: +4 ⭐, +3 🤝 y +65 k€ val.');
  }else if(act==='hack'){
    if(g.st[0]<4)return;
    g.st[0]=f1(g.st[0]-4);
    g.C.burn=Math.max(0,g.C.burn-20);g.st[1]=clamp(g.st[1]+8);
    if(g.startup.activeProj){
      const pObj=g.startup.activeProj.fullProj||STARTUP_PROJECTS.find(x=>x.id===g.startup.activeProj.id);
      if(pObj){
        g.startup.activeProj.prog=Math.min(pObj.effort,g.startup.activeProj.prog+42);
        if(g.startup.activeProj.prog>=pObj.effort)completeSuProject(pObj);
      }
    }
    sfx('ok');toast('🍕 Offsite & Hackathon: −20 🔥 Burnout, +8 🧠 y +42 pts de proyecto');
  }else if(act==='vc'){
    const r=VC_ROUNDS.find(x=>x.id===val);
    if(!r||g.startup.rounds.includes(r.id)||g.startup.val<r.minVal)return;
    g.startup.rounds.push(r.id);
    g.st[0]=f1(g.st[0]+r.cash);
    g.startup.val+=r.valBoost;
    g.C.burn=Math.min(100,g.C.burn+r.burn);
    sfx('coin');
    addNews('🏦',`¡${g.startup.name} cierra su ${r.n} levantando +${r.cash} k€ de liquidez!`,1);
    pushBigAlert({
      tag:'🏦 RONDA DE INVERSIÓN CERRADA',
      logoHtml:brandLogo('startup',78,g.startup.ic),
      title:r.n,
      desc:`Has cerrado con éxito la <b>${r.n}</b>.<br><br>💶 Liquidez inyectada en caja: <b>+${r.cash} k€</b><br>📈 Salto de valoración: <b>+${fmtVal(r.valBoost)}</b>`,
      color:'#ffc83d'
    });
  }else if(act==='pivot'){
    const sec=STARTUP_SECTORS[+val];
    if(!sec||g.st[0]<8)return;
    g.st[0]=f1(g.st[0]-8);
    g.startup.sector=sec[0];g.startup.desc=sec[1];g.startup.secArea=sec[2];
    sfx('ok');toast(`🔄 Pivotaste tu startup hacia ${sec[0]}`);
  }else if(act==='acq'){
    const riv=RIVAL_CORPS.find(x=>x.k===val);
    if(!riv||g.startup.acquired.includes(riv.k))return;
    const curRivVal=getRivalVal(riv);
    const price=Math.max(10,Math.round(curRivVal*0.30));
    if(g.st[0]<price)return;
    g.st[0]=f1(g.st[0]-price);
    g.startup.acquired.push(riv.k);
    g.startup.val+=curRivVal;
    g.startup.mrr=f1((g.startup.mrr||0)+Math.max(1,Math.round(curRivVal*0.012*10)/10));
    sfx('coin');
    addNews('🏢',`¡Operación corporativa! ${g.startup.name} absorbe a ${riv.n} sumando +${fmtVal(curRivVal)} de valoración.`,1);
    pushBigAlert({
      tag:'🏢 ADQUISICIÓN M&A COMPLETADA',
      logoHtml:brandLogo(riv.k,78,riv.ic),
      title:`¡Has comprado ${riv.n}!`,
      desc:`<b>${g.startup.name}</b> ha absorbido a <b>${riv.n}</b> por <b>${fmtVal(price)}</b>.<br>Sumas <b>+${fmtVal(curRivVal)}</b> a tu valoración y su cartera de clientes.`,
      color:'#2ee66b'
    });
  }
  checkRankMilestoneRewards();
  const np=startupRankPos().pos;
  if(np<prevRank){
    pushBigAlert({tag:'🏆 ¡SUBES EN EL RANKING!',logoHtml:brandLogo('startup',78,g.startup.ic),title:`Puesto #${np} Mundial`,desc:`<b>${g.startup.name}</b> escala hasta el puesto <b>#${np} de ${startupRankPos().total}</b> del mundo.`,color:'#ffc83d'});
  }
  checkSedeUpgrade();save();render();
}

function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return Math.abs(h);}

function npcLookFromSeed(seed,lv){
  const h=Math.abs(seed);
  const st=lv>=5?2:(lv>=3?([2,4,5][h%3]):([0,1,3,4][h%4]));
  const ac=lv>=4?0:([0,0,1,2,8,0][Math.floor(h/5)%6]);
  return {
    sk:(h%5<4?0:(1+(h%6))),
    fc:Math.floor(h/3)%3,
    pe:Math.floor(h/7)%4===0?1:0,
    ey:Math.floor(h/11)%EY.length,
    fe:Math.floor(h/13)%3,
    eb:Math.floor(h/17)%3,
    hs:Math.floor(h/19)%HS.length,
    hc:Math.floor(h/23)%HC.length,
    fh:(h%3===0?Math.floor(h/29)%FH.length:0),
    mo:Math.floor(h/31)%5,
    gl:(Math.floor(h/37)%3===0?(1+Math.floor(h/41)%4):0),
    ac,
    ea:(Math.floor(h/43)%5===0?1:0),
    st,
    sc:Math.floor(h/47)%SC.length,
    pr:lv>=3?0:(Math.floor(h/53)%4),
    bg:Math.floor(h/59)%BG.length,
    bp:Math.floor(h/61)%BP.length,
    fr:lv>=5?0:(lv>=3?2:1)
  };
}

const ORG_SLOTS=[
  {lv:6,slot:0,dept:'Presidencia / Board',roleOverride:'CEO / Presidente'},
  {lv:5,slot:0,dept:'Dirección Ejecutiva',roleOverride:null},
  {lv:4,slot:0,dept:'Tecnología & Cloud',roleOverride:null},
  {lv:4,slot:1,dept:'Producto & Negocio',roleOverride:null},
  {lv:3,slot:0,dept:'Ingeniería',roleOverride:null},
  {lv:3,slot:1,dept:'Operaciones & Sec',roleOverride:null},
  {lv:2,slot:0,dept:'Arquitectura',roleOverride:null},
  {lv:2,slot:1,dept:'Ciberseguridad',roleOverride:null},
  {lv:1,slot:0,dept:'Desarrollo',roleOverride:null},
  {lv:1,slot:1,dept:'Sistemas',roleOverride:null},
  {lv:0,slot:0,dept:'Soporte N1',roleOverride:null}
];

function getCompanyOrg(coKey){
  if(!g)return [];
  g.orgState=g.orgState||{};
  if(coKey==='startup'&&g.startup){
    ensureStartupFields();
    const list=[{id:'su_ceo',lv:6,role:'Founder & CEO',dept:'Dirección',name:g.name,av:'👑',trait:'Fundador',traitD:'Mandas tú.',rel:100,secSkill:attr('sec'),isMe:true,isBoss:false,status:'ok'}];
    (g.startup.staff||[]).forEach((id,i)=>{
      const emp=STAFF_POOL.find(x=>x.id===id);
      if(emp)list.push({id:'su_'+id,lv:Math.max(0,5-Math.floor(i/2)),role:emp.role,dept:emp.areaName,name:emp.n,av:emp.ic,trait:emp.areaName,traitD:emp.perk,rel:80,secSkill:40+emp.sk.tec*4,isMe:false,isBoss:false,status:'ok'});
    });
    return list;
  }
  const c=CO[coKey]||CO.sop;
  // Upgrade old 6-person orgs cleanly to the deeper 11-person 7-level hierarchy
  if(!g.orgState[coKey] || g.orgState[coKey].length<10 || !g.orgState[coKey][0].id){
    const seed=hashStr(coKey+'_'+(g.runSeed||1));
    const usedNames=new Set();
    const members=ORG_SLOTS.map((sl,idx)=>{
      let h=hashStr(coKey+'_'+sl.lv+'_'+sl.slot+'_'+(seed%997));
      let full='';
      for(let tries=0;tries<10;tries++){
        const fn=NPC_FIRST[(h+tries*3)%NPC_FIRST.length];
        const ln=NPC_LAST[(Math.floor(h/7)+tries*5)%NPC_LAST.length];
        full=fn+' '+ln;
        if(!usedNames.has(full))break;
      }
      usedNames.add(full);
      const av=NPC_AVS[Math.floor(h/13)%NPC_AVS.length];
      const tr=NPC_TRAITS[Math.floor(h/19)%NPC_TRAITS.length];
      const baseRel=35+(h%36);
      const baseRep=Math.min(96,44 + sl.lv*7 + (h%18));
      const secSkill=Math.min(96,24 + c.tier*10 + sl.lv*7 + (sl.dept.includes('Sec')||sl.dept.includes('Ciber')?12:0) + (h%9));
      return {
        id:`${coKey}_${sl.lv}_${sl.slot}`,
        coKey,lv:sl.lv,slot:sl.slot,dept:sl.dept,
        roleOverride:sl.roleOverride,
        name:full,av,look:npcLookFromSeed(h,sl.lv),
        trait:tr[0],traitD:tr[1],rel:baseRel,rep:baseRep,secSkill,
        hacked:0,sabotaged:0,hostile:0,coffeeTurn:-1
      };
    });
    g.orgState[coKey]=members;
  }
  const isCurrent=(!g.startup && coKey===g.co);
  return g.orgState[coKey].map(m=>{
    if(m.rep===undefined)m.rep=Math.min(96,44 + m.lv*7 + (hashStr(m.id||'x')%18));
    const role=m.roleOverride||(c.lad[Math.min(5,m.lv)]||'Directivo');
    const sal=m.lv>=6?f1(c.sal[5]*1.45):c.sal[Math.min(5,m.lv)];
    const isBoss=isCurrent && (m.lv===Math.min(6,g.rank+1)) && m.slot===0;
    const isPeer=isCurrent && (m.lv===g.rank);
    return {...m,coKey,role,sal,isBoss,isPeer,isCurrent};
  });
}


function claimJobChance(m){
  if(!g||!m||g.startup)return {pct:5,myScore:0,targetScore:100,deciderName:'el Consejo'};
  const org=getCompanyOrg(g.co);
  const decider=org.find(x=>x.lv===m.lv+1 && x.slot===0) || org.find(x=>x.lv===m.lv+1);
  const deciderRel=decider?decider.rel:g.st[3];
  const deciderName=decider?decider.name:'el Consejo de Administración';
  const statAvg=(attr('tec')+attr('sys')+attr('sec')+attr('com')+attr('pol'))/5;
  const certMod=m.lv>=6?(g.certs.length>=8?8:-14):(certOK()?8:-12);
  const myScore=statAvg*0.46 + g.st[2]*0.34 + deciderRel*0.20 + attr('pol')*0.12 + certMod;
  const tRep=(m.rep!==undefined?m.rep:65);
  const diffBuffer=m.lv>=6?24:16;
  const targetScore=tRep*0.58 + m.secSkill*0.32 + m.lv*4.5 + diffBuffer;
  const pct=Math.max(5,Math.min(92,Math.round(45 + (myScore - targetScore)*1.15)));
  return {pct,myScore:Math.round(myScore),targetScore:Math.round(targetScore),decider,deciderName};
}

function orgFireNpc(coKey,npcId){
  if(!g||g.startup||coKey!==g.co)return;
  getCompanyOrg(coKey);
  const arr=g.orgState[coKey];
  const idx=arr.findIndex(x=>x.id===npcId);
  if(idx<0)return;
  const m=arr[idx];
  if(m.lv>=g.rank){toast('🔒 Solo puedes despedir a gente por debajo de tu rango');return;}
  const lowRep=(m.rep<=35);
  const oldName=m.name;
  const h=hashStr(coKey+'_'+m.lv+'_'+m.slot+'_'+(g.turn*37+idx*13+Math.floor(Math.random()*999)));
  const fn=NPC_FIRST[h%NPC_FIRST.length], ln=NPC_LAST[Math.floor(h/7)%NPC_LAST.length];
  const tr=NPC_TRAITS[Math.floor(h/19)%NPC_TRAITS.length];
  arr[idx]={
    ...m,
    name:fn+' '+ln,
    av:NPC_AVS[Math.floor(h/13)%NPC_AVS.length],
    look:npcLookFromSeed(h,m.lv),
    trait:tr[0],traitD:tr[1],
    rel:55,rep:45,hacked:0,sabotaged:0,hostile:0,coffeeTurn:-1
  };
  g.firedCount=(g.firedCount||0)+1;
  g.st[0]=f1(g.st[0]+1.5);
  if(lowRep){
    g.st[2]=clamp(g.st[2]+3);
    g.st[4]=clamp(g.st[4]-2);
    g.imp+=8;
    sfx('ok');buzz(25);
    addNews('🔥',`${g.name} despide a ${oldName} en ${co().n} por bajo rendimiento (rep. ${m.rep}%). Dirección aplaude la decisión.`,1);
    toast(`🔥 Despediste a ${oldName} (justificado): +3 ⭐, +1.5 k€, +8 asc.`);
  }else{
    g.st[2]=clamp(g.st[2]-4);
    g.st[3]=clamp(g.st[3]-5);
    g.st[4]=clamp(g.st[4]-6);
    arr.forEach(x=>{if(x.lv<g.rank&&x.id!==m.id)x.rel=Math.max(0,x.rel-8);});
    sfx('bad');buzz(35);
    addNews('⚠️',`${g.name} despide de forma polémica a ${oldName} en ${co().n} pese a su buena reputación (${m.rep}%).`,1);
    toast(`🔥 Despediste a ${oldName} (polémico): −4 ⭐, −6 ⚖️, −5 🤝, +1.5 k€`);
  }
  save();render();
}

function renderOrgChart(coKey,compact=false){
  const c=(coKey==='startup'&&g.startup)?coInfo():(CO[coKey]||CO.sop);
  const members=getCompanyOrg(coKey);
  const isCurrent=(!g.startup && coKey===g.co) || (g.startup && coKey==='startup');
  const myLv=g.startup?(co().rankIdx||3):g.rank;

  if(!isCurrent){
    // En empresas rivales: SOLO ves gente en tu misma posición (myLv) o una por encima (myLv + 1)
    const maxVis=Math.min(6,myLv+1);
    const vis=members.filter(m=>m.lv===myLv || m.lv===maxVis);
    const hiddenHigh=members.filter(m=>m.lv>maxVis).length;
    const hiddenLow=members.filter(m=>m.lv<myLv).length;
    const topLock=hiddenHigh>0?`<div class="org-locked"><span>🔒 ${hiddenHigh} cargos superiores (N${maxVis+2}–N7) · Clasificado</span><span>Asciende para verlos</span></div>`:'';
    const lowLock=hiddenLow>0?`<div class="org-locked" style="opacity:.7"><span>👁️ ${hiddenLow} puestos inferiores (N1–N${myLv}) ocultos</span><span>Fuera de tu nivel</span></div>`:'';
    const rows=vis.map(m=>{
      const badge=m.lv===myLv?'<span class="gdt-pill ok">🤝 TU MISMO NIVEL</span>':'<span class="gdt-pill warn">⬆️ +1 NIVEL SUPERIOR</span>';
      const statusTag=(m.hacked?' <span class="mono" style="font-size:10px;color:#4ade80">[HACKEADO]</span>':'')+(m.hostile>0?' <span class="mono" style="font-size:10px;color:#fb7185">[HOSTIL]</span>':'');
      return `<div class="org-lvl ${m.lv>myLv?'boss':''}">
        <div class="org-rank">N${m.lv+1}</div>
        <div class="org-av">${npcFace(m,40)}</div>
        <div class="org-info">
          <b>${m.name}${statusTag}</b>
          <small>${m.role} <span class="org-dept">${m.dept}</span></small>
          <small>🛡️ Def. Ciber: <b>${m.secSkill}/100</b> · <i>${m.trait}</i></small>
          <div style="margin-top:3px">${badge}</div>
        </div>
        <div class="org-acts">
          <button class="gh" style="padding:5px 9px;font-size:11.5px;border-color:#2ee66b;color:#86efac" data-a="go_hack_rival" data-k="${coKey}" data-v="${m.id}">💀 Hackear</button>
        </div>
      </div>`;
    }).join('');
    return `<div class="org-tree">${topLock}${rows}${lowLock}</div>`;
  }

  let playerPlaced=false;
  const rows=members.map(m=>{
    if(m.isMe){
      return `<div class="org-lvl me">
        <div class="org-rank">C</div>
        <div class="org-av">${face(g.look,40)}</div>
        <div class="org-info"><b>${m.name} (TÚ)</b><small>${m.role} · ${m.trait}</small></div>
        <span class="gdt-pill ok">CEO</span>
      </div>`;
    }
    const badge=m.isBoss?'<span class="gdt-pill warn">👔 TU JEFE DIRECTO</span>':(m.lv>=6?'<span class="gdt-pill" style="border-color:var(--gold);color:#fef08a">🏛️ PRESIDENCIA</span>':(m.lv===5?'<span class="gdt-pill" style="border-color:var(--vio);color:#ddd6fe">👑 DIRECCIÓN</span>':(m.isPeer?'<span class="gdt-pill ok">🤝 TU NIVEL</span>':'')));
    const statusTag=(m.hacked?' <span class="mono" style="font-size:10px;color:#4ade80">[HACKEADO]</span>':'')+(m.sabotaged?' <span class="mono" style="font-size:10px;color:#fb7185">[SABOTEADO]</span>':'');
    const relCol=m.rel>=70?'var(--grn)':m.rel>=40?'var(--cyn)':'var(--red)';

      <div class="org-rank">N${m.lv+1}</div>
      <div class="org-av">${npcFace(m,40)}</div>
      <div class="org-info">
        <b>${m.name}${statusTag}</b>
        <small>${m.role} <span class="org-dept">${m.dept}</span></small>

          <div class="mono" style="font-size:9.5px;display:flex;justify-content:space-between"><span>🤝 Rel.</span><b style="color:${relCol}">${m.rel}%</b></div>

          <div class="bar"><i style="width:${m.rep!==undefined?m.rep:60}%;background:${(m.rep||50)<=35?'#fb7185':(m.rep||50)>=75?'#fbbf24':'#38bdf8'}"></i></div>
        </div>
      </div>`:''}
      ${isCurrent && !g.startup?(()=>{
        const canFire=m.lv<g.rank;
        const canClaim=m.lv===g.rank+1;
        const clInfo=canClaim?claimJobChance(m):null;
        const onCd=g.claimTurn!==undefined&&(g.turn-g.claimTurn)<2;
        return `<div class="org-acts">
          <button class="gh" style="padding:5px 8px;font-size:11px" data-a="org_coffee" data-v="${m.id}" ${m.coffeeTurn===g.turn?'disabled':''}>☕ Café</button>
          <button class="gh" style="padding:5px 8px;font-size:11px;border-color:#2ee66b;color:#86efac" data-a="go_hack_target" data-v="${m.id}">💀 Hackear</button>
          ${canFire?`<button class="gh org-btn-fire" style="padding:5px 8px;font-size:11px" data-a="org_fire" data-v="${m.id}" title="Despedir subordinado (rep. ${m.rep}%)">🔥 Despedir</button>`:''}
          ${canClaim?`<button class="gh ${m.lv>=6?'org-btn-ceo':'org-btn-claim'}" style="padding:5px 9px;font-size:11px" data-a="org_claim" data-v="${m.id}" ${onCd?'disabled':''} title="Pedir su puesto a ${clInfo.deciderName} (Tu poder ${clInfo.myScore} vs Rival ${clInfo.targetScore})">${m.lv>=6?'👑 Tomar CEO':'⚔️ Pedir puesto'} (${clInfo.pct}%)</button>`:''}
        </div>`;
      })():''}
    </div>`;
  }).join('');
  return `<div class="org-tree">${rows}</div>`;
}

function hackSuccessChance(op,targetNpc){
  if(!g)return 50;
  const secPts=brPoints('sec');
  const defPen=targetNpc?Math.round(((targetNpc.secSkill||45)-45)*0.45):0;
  const ethMod=ethicsInfo(g.st[4]).hackMod;
  const base=32 + attr('sec')*0.50 + attr('tec')*0.26 + attr('sys')*0.14 + secPts*2.5 + (own('port')?5:0) + (own('gorra')?4:0) + ethMod - (op.diff-10)*5 - defPen - Math.floor((g.hackHeat||0)*0.18);
  return Math.max(12,Math.min(92,Math.round(base)));
}

function addHackLog(txt){
  if(!g)return;
  g.hackLog=g.hackLog||[];
  g.hackLog.unshift(`Sem. ${WK()} · ${txt}`);
  if(g.hackLog.length>12)g.hackLog.length=12;
}

/* ¡Ellos también intentan hackearte a ti! */
function triggerRivalCounterHack(attacker,coKey,reason){
  if(!g)return;
  const cObj=CO[coKey]||CO.sop;
  const atkName=attacker?attacker.name:('Operador de '+cObj.n);
  const atkSec=attacker?(attacker.secSkill||45):(35+cObj.tier*10);
  const myDef=attr('sec') + brPoints('sec')*4 + (own('port')?6:0) + Math.floor(Math.random()*28);
  const atkRoll=atkSec + Math.floor(Math.random()*26);
  const defended=myDef>=atkRoll;

  if(defended){
    g.st[2]=clamp(g.st[2]+3);
    g.A.sec=Math.min(100,(g.A.sec||12)+1);
    sfx('ok');
    const txt=`🛡️ ¡Ataque repelido! ${atkName} (${cObj.n}) intentó hackearte (${reason}), pero tu Seguridad (${attr('sec')}/100) bloqueó la intrusión. (+3 ⭐, +1 🛡️)`;
    addHackLog(txt);
    addNews('🛡️',`${g.name} neutraliza un intento de ciberataque lanzado desde ${cObj.n}.`,1);
    pushBigAlert({
      tag:'🛡️ CIBERATAQUE REPELIDO',
      logoHtml:attacker?npcFace(attacker,38):brandLogo(coKey,38),
      title:`Bloqueaste a ${atkName}`,
      desc:`Intentó atacarte desde <b>${cObj.n}</b> (${reason}), pero tus defensas aguantaron.<br>Recompensa: <b>+3 ⭐ Reputación</b> y <b>+1 🛡️ Seguridad</b>.`,
      color:'#34d399',
      action:attacker?{label:'💀 Contraatacar',a:'go_hack_rival',v:attacker.id,k:coKey}:null
    });
  }else{
    const cashLoss=f1(3+Math.min(8,Math.round(atkSec/14)));
    const repLoss=4+Math.floor(atkSec/22);
    g.st[0]=f1(g.st[0]-cashLoss);
    g.st[2]=clamp(g.st[2]-repLoss);
    g.st[1]=clamp(g.st[1]-4);
    g.C.dt=Math.min(100,g.C.dt+8);
    sfx('bad');buzz(65);
    const txt=`🚨 ¡TE HAN HACKEADO! ${atkName} (${cObj.n}) vulneró tus credenciales (${reason}): −${cashLoss} k€, −${repLoss} ⭐, −4 🧠, +8 🧨.`;
    addHackLog(txt);
    addNews('🚨',`Filtración de datos: ${g.name} sufre un ciberataque atribuido a personal de ${cObj.n}.`,1);
    pushBigAlert({
      tag:'🚨 ¡TE HAN HACKEADO!',
      logoHtml:attacker?npcFace(attacker,38):brandLogo(coKey,38),
      title:`${atkName} (${cObj.n})`,
      desc:`Ha vulnerado tu cuenta (${reason}):<br>💸 <b>−${cashLoss} k€</b> · ⭐ <b>−${repLoss} Rep.</b> · 🧠 <b>−4</b> · 🧨 <b>+8 Deuda</b>.<br>Sube tu <b>🛡️ Seguridad</b> para frenarlos.`,
      color:'#fb7185',
      action:attacker?{label:'💀 Contraatacar',a:'go_hack_rival',v:attacker.id,k:coKey}:null
    });
  }
}

function passiveRivalHackCheck(){
  if(!g||g.turn<4)return;
  // Buscar enemigos hostiles que hayas hackeado antes
  const hostiles=[];
  if(g.orgState){
    Object.keys(g.orgState).forEach(k=>{
      (g.orgState[k]||[]).forEach(m=>{
        if(m.hostile>0 && (k!==g.co || m.lv!==g.rank))hostiles.push({m,k});
      });
    });
  }
  const heat=Number(g.hackHeat)||0;
  let prob=hostiles.length?Math.min(0.32, 0.12 + hostiles.length*0.05 + heat*0.0015):(g.st[2]>=55?0.055:0.02);
  if(Math.random()<prob){
    if(hostiles.length){
      const pickH=pick(hostiles);
      pickH.m.hostile=Math.max(0,pickH.m.hostile-1);
      triggerRivalCounterHack(pickH.m,pickH.k,'represalia directa');
    }else{
      const myLv=g.startup?(co().rankIdx||3):g.rank;
      const otherCos=Object.keys(CO).filter(k=>k!==g.co && CO[k].tier<=co().tier+1);
      if(otherCos.length){
        const rk=pick(otherCos);
        const org=getCompanyOrg(rk);
        const vis=org.filter(m=>m.lv===myLv || m.lv===Math.min(6,myLv+1));
        const atk=vis.length?pick(vis):org[0];
        triggerRivalCounterHack(atk,rk,'espionaje industrial');
      }
    }
  }
}

function runPersonalHack(opId){
  if(!g)return;
  const op=PERS_HACKS.find(x=>x.id===opId);
  if(!op)return;
  g.hackHeat=Math.max(0,Math.min(100,Number(g.hackHeat)||0));
  if(g.hackTurn!==g.turn){g.hackTurn=g.turn;g.hackUses=0;}
  if(g.hackUses>=2){toast('⏳ Límite de 2 ciberoperaciones por semana. Atiende un ticket para avanzar.');return;}
  if(g.st[0]<op.cost){toast('💶 Fondos insuficientes para herramientas/proxies');return;}

  const scope=ui.hackScope||(g.startup?'rival':'own');
  const isRival=(scope==='rival');
  let targetCo=isRival?(ui.hackRivalCo||Object.keys(CO).find(k=>k!==g.co)):g.co;
  const org=getCompanyOrg(targetCo);
  const myLv=g.startup?(co().rankIdx||3):g.rank;
  const allowed=isRival?org.filter(m=>m.lv===myLv||m.lv===Math.min(6,myLv+1)):org;
  let targetNpc=allowed.find(x=>x.id===ui.hackTargetId)||allowed[0];
  const rawArr=(g.orgState&&g.orgState[targetCo])?g.orgState[targetCo]:[];
  const rawNpc=targetNpc?rawArr.find(x=>x.id===targetNpc.id):null;

  g.st[0]=f1(g.st[0]-op.cost);
  g.hackUses++;
  const chance=hackSuccessChance(op,targetNpc);
  const ok=(Math.random()*100)<chance;

  if(ok){
    sfx('ok');buzz(35);
    g.st[4]=clamp(g.st[4]-4);
    g.hackHeat=Math.min(100,g.hackHeat+Math.max(5,Math.round(op.heat*0.65)));
    let msg='';
    if(isRival && targetNpc){
      if(rawNpc){rawNpc.hacked=1;rawNpc.hostile=(rawNpc.hostile||0)+2;}
      g.rivalInsider=g.rivalInsider||{};
      const coName=(CO[targetCo]||CO.sop).n;
      if(op.id==='boss'){
        g.st[0]=f1(g.st[0]+8);g.st[2]=clamp(g.st[2]+4);
        g.rivalInsider[targetCo]=Math.min(30,(g.rivalInsider[targetCo]||0)+15);
        msg=`🕵️ ¡Hackeaste a ${targetNpc.name} (${coName})! +8 k€, +4 ⭐ y +15% ventaja al postularte a ${coName}.`;
      }else if(op.id==='phish'){
        g.st[3]=clamp(g.st[3]+7);g.st[0]=f1(g.st[0]+6);
        g.rivalInsider[targetCo]=Math.min(30,(g.rivalInsider[targetCo]||0)+15);
        msg=`🎭 ¡Phishing exitoso a ${targetNpc.name} (${coName})! +7 🤝 Red, +6 k€ y +15% al postularte ahí.`;
      }else if(op.id==='sabotage_col'){
        g.st[2]=clamp(g.st[2]+6);g.st[0]=f1(g.st[0]+5);
        if(g.rivalVals&&g.rivalVals[targetCo])g.rivalVals[targetCo]=Math.max(10,Math.round(g.rivalVals[targetCo]*0.94));
        if(rawNpc)rawNpc.sabotaged=1;
        msg=`💣 ¡Saboteaste a ${targetNpc.name} (${coName})! Su proyecto se retrasa: +6 ⭐ Reputación y +5 k€.`;
      }else{
        g.st[0]=f1(g.st[0]+12);
        if(g.startup)g.startup.val+=150;
        msg=`📁 ¡Secretos exfiltrados de ${targetNpc.name} (${coName})! +12 k€${g.startup?' y +150 k€ val. Startup':''}.`;
      }
      addHackLog(`✅ ${op.ic} Hackeaste a ${targetNpc.name} (${coName}).`);
      // Incluso al tener éxito, un rival de alta seguridad puede contraatacar luego (20% inmediato si tiene secSkill >= 65)
      if(targetNpc.secSkill>=65 && Math.random()<0.22){
        setTimeout(()=>triggerRivalCounterHack(rawNpc||targetNpc,targetCo,'detección post-intrusión'),350);
      }
    }else if(op.id==='boss'){
      g.imp+=Math.round(impNeed()*0.18);
      g.st[2]=clamp(g.st[2]+4);
      g.st[3]=clamp(g.st[3]+5);
      g.st[0]=f1(g.st[0]+6);
      if(rawNpc){rawNpc.hacked=1;rawNpc.rep=Math.max(0,(rawNpc.rep||60)-16);rawNpc.hostile=(rawNpc.hostile||0)+1;}
      msg=`👔 ¡Acceso total al Slack de ${targetNpc?targetNpc.name:'tu jefe'}! Su rep. cae −16%, +4 ⭐, +18% asc. y +6 k€.`;
    }else if(op.id==='smear'){
      const drop=25+Math.floor(Math.random()*8);
      g.st[2]=clamp(g.st[2]+7);
      if(rawNpc){rawNpc.sabotaged=1;rawNpc.rep=Math.max(0,(rawNpc.rep||60)-drop);rawNpc.hostile=(rawNpc.hostile||0)+2;}
      msg=`📉 ¡Campaña de desprestigio perfecta! La reputación interna de ${targetNpc?targetNpc.name:'tu objetivo'} cae −${drop}% y tú ganas +7 ⭐.`;
    }else if(op.id==='payroll'){
      const bonus=f1(7+Math.random()*6);
      g.st[0]=f1(g.st[0]+bonus);
      msg=`💶 ¡Inyección en nóminas exitosa! Recibes +${bonus} k€ en concepto de «guardias nocturnas».`;
    }else if(op.id==='phish'){
      g.imp+=Math.round(impNeed()*0.22);
      g.C.burn=Math.max(0,g.C.burn-15);
      g.st[1]=clamp(g.st[1]+6);
      g.st[2]=clamp(g.st[2]+3);
      if(rawNpc){rawNpc.hacked=1;rawNpc.rep=Math.max(0,(rawNpc.rep||60)-14);rawNpc.hostile=(rawNpc.hostile||0)+1;}
      msg=`🎭 ¡Phishing clavado a ${targetNpc?targetNpc.name:'objetivo'}! Su rep. cae −14%, +3 ⭐, +22% asc. y −15 Burnout.`;
    }else if(op.id==='sabotage_col'){
      g.imp+=Math.round(impNeed()*0.15);
      g.st[2]=clamp(g.st[2]+6);
      if(rawNpc){rawNpc.sabotaged=1;rawNpc.rep=Math.max(0,(rawNpc.rep||60)-24);rawNpc.rel=Math.max(0,rawNpc.rel-20);rawNpc.hostile=(rawNpc.hostile||0)+1;}
      msg=`💣 ¡Sabotaje limpio a ${targetNpc?targetNpc.name:'tu compañero'}! Su rep. cae −24%, +15% ascenso y +6 ⭐.`;
    }else if(op.id==='secrets'){
      g.st[0]=f1(g.st[0]+12);
      if(g.startup)g.startup.val+=150;
      if(rawNpc){rawNpc.rep=Math.max(0,(rawNpc.rep||60)-10);}
      msg=`📁 ¡Secretos exfiltrados! +12 k€${rawNpc?' y −10% rep. al responsable':''}${g.startup?' y +150 k€ val. Startup':''}.`;
    }else if(op.id==='logs'){
      g.C.dt=Math.max(0,g.C.dt-25);
      g.st[2]=clamp(g.st[2]+8);
      if(rawNpc){rawNpc.rep=Math.max(0,(rawNpc.rep||60)-6);}
      msg=`🧹 ¡Logs y KPIs manipulados! −25 Deuda Técnica y +8 ⭐ Reputación.`;
    }else if(op.id==='cert'){
      const cand=CURSOS.filter(c=>!g.certs.includes(c.id)&&c.c<=4&&(!c.req||g.certs.includes(c.req)));
      if(cand.length){
        const pickC=cand[0];
        g.certs.push(pickC.id);
        if(pickC.tp)g.tp+=pickC.tp;
        if(pickC.rep)g.st[2]=clamp(g.st[2]+pickC.rep);
        msg=`🔓 ¡Examen hackeado! Obtienes gratis «${pickC.n}».`;
        addNews('🎓',`${g.name} aprueba «${pickC.n}» con un 10 sospechosamente rápido.`,1);
      }else{
        g.st[0]=f1(g.st[0]+6);
        msg=`🔓 Ya tenías todos los certificados básicos: vendes las preguntas del examen por +6 k€.`;
      }
    }
    addHackLog(`✅ ${op.n} completado (${chance}%).`);
    ui.hackMsg={ok:true,txt:msg};
  }else{
    sfx('bad');buzz(60);
    g.hackHeat=Math.min(100,g.hackHeat+op.heat+10);
    g.st[2]=clamp(g.st[2]-7);
    g.st[4]=clamp(g.st[4]-7);
    if(rawNpc){rawNpc.rel=Math.max(0,rawNpc.rel-25);rawNpc.rep=clamp((rawNpc.rep||60)+6);rawNpc.hostile=(rawNpc.hostile||0)+2;}
    let failTxt=`🚨 ¡Cazado por el SOC (${chance}% prob.)! Pierdes −7 ⭐ Reputación, −7 🧭 Integridad y +${op.heat+10}% sospecha.`;
    addHackLog(`❌ Fallaste ${op.n} contra ${targetNpc?targetNpc.name:'objetivo'}.`);
    // ¡El objetivo rival te contraataca al instante si fallas (60% prob.)!
    if(isRival && targetNpc && Math.random()<0.62){
      triggerRivalCounterHack(rawNpc||targetNpc,targetCo,'contraataque inmediato tras pillarte');
      failTxt+=' ¡Y '+targetNpc.name+' lanzó un contraataque contra tus sistemas!';
    }
    if(g.hackHeat>=90){
      const fine=Math.min(Math.max(6,Math.round(g.st[0]*0.25)),25);
      g.st[0]=f1(g.st[0]-fine);
      g.hackHeat=45;
      failTxt+=` ¡Auditoría forense! Multa disciplinaria de −${fine} k€.`;
      addNews('🚨',`Escándalo de seguridad en ${co().n}: investigan accesos anómalos vinculados a ${g.name}.`,1);
    }
    ui.hackMsg={ok:false,txt:failTxt};
  }
  save();render();
}

function cleanPersonalTraces(){
  if(!g||g.st[0]<4)return;
  g.st[0]=f1(g.st[0]-4);
  g.hackHeat=Math.max(0,Math.round((g.hackHeat||0)-35));
  sfx('ok');
  ui.hackMsg={ok:true,txt:'🧼 Proxy limpio y logs borrados (−4 k€): −35% sospecha interna.'};
  save();render();
}

/* === APLICAR CANDIDATURA A OTRAS EMPRESAS (DEPENDIENTE DE REPUTACIÓN) === */
const TIER_MIN_REP=[0, 28, 45, 62, 78];
function applyChanceInfo(coKey){
  const tc=CO[coKey];
  if(!tc||!g)return {ok:false,pct:0,reason:'No disponible',minRep:0,offRank:0,bonus:0};
  const rep=g.st[2],red=g.st[3],certs=(g.certs||[]).length;
  const minRep=TIER_MIN_REP[tc.tier]||0;
  const insider=(g.rivalInsider&&g.rivalInsider[coKey])||0;
  let offRank=g.rank;
  if(tc.tier>co().tier)offRank=Math.max(0,g.rank-(tc.tier-co().tier));
  else if(tc.tier<co().tier)offRank=Math.min(5,g.rank+1);
  const bonus=2+tc.tier*2+Math.floor(rep/25);

  if(rep<minRep && insider<15){
    return {ok:false,pct:0,minRep,offRank,bonus,insider,reason:`Necesitas ≥ ${minRep} ⭐ Reputación (tienes ${rep})`};
  }
  let pct=Math.round(
    (rep - 20) * 1.05
    + red * 0.28
    + attr('com') * 0.22
    + certs * 3.5
    + g.rank * 4
    + insider
    + ethicsInfo(g.st[4]).applyMod
    - tc.tier * 17
  );
  pct=Math.max(6,Math.min(95,pct));
  return {ok:true,pct,minRep,offRank,bonus,insider,reason:''};
}

function applyToCompany(coKey){
  if(!g||!CO[coKey])return;
  if(!g.startup && coKey===g.co)return;
  g.appCd=g.appCd||{};
  if(g.appTurn!==g.turn){g.appTurn=g.turn;g.appUses=0;}
  if(g.appUses>=2){toast('⏳ Máximo 2 candidaturas por semana. Atiende un ticket para avanzar.');return;}
  if((g.appCd[coKey]||0)>g.turn){toast(`⏳ ${CO[coKey].n} ya revisó tu CV. Espera ${g.appCd[coKey]-g.turn} sem.`);return;}

  const info=applyChanceInfo(coKey);
  if(!info.ok){toast('🔒 '+info.reason);return;}

  g.appUses++;
  g.appCd[coKey]=g.turn+3;
  const accepted=(Math.random()*100)<info.pct;
  const tc=CO[coKey];

  if(accepted){
    const prev=co().n;
    g.startup=null;
    g.co=coKey;
    g.rank=info.offRank;
    g.imp=0;
    g.st[0]=f1(g.st[0]+info.bonus);
    g.F.cambio=1;
    g.offers=[];
    sfx('coin');buzz(35);
    addNews('🎉',`${g.name} supera el proceso de selección y ficha por ${tc.n} como ${tc.lad[g.rank]}`,1);
    g.log.push(`📩 Candidatura aceptada en ${tc.n} (${tc.lad[g.rank]})`);
    pushBigAlert({
      tag:'🎉 ¡CANDIDATURA ACEPTADA!',
      logoHtml:brandLogo(coKey,40),
      title:`¡Te contratan en ${tc.n}!`,
      desc:`Con un <b>${info.pct}%</b> de opciones gracias a tu Reputación (${g.st[2]} ⭐), entras como <b>${tc.lad[g.rank]}</b> (${tc.sal[g.rank]} k€/mes) + <b>${info.bonus} k€</b> bono.`,
      color:'#34d399'
    });
    checkSedeUpgrade(true);
    ui.tab='work';ui.ticketOpen=false;ui.simProg=0;
    save();render();
  }else{
    g.st[1]=clamp(g.st[1]-2);
    sfx('bad');buzz(25);
    const rejMsg=pick([
      `«Gracias por tu interés en ${tc.n}, pero hemos decidido avanzar con un perfil con más visibilidad en el sector.»`,
      `«Tu CV en ${tc.n} es interesante, aunque buscamos mayor reputación (⭐) y certificaciones para este puesto.»`,
      `«${tc.n} guardará tu currículum en su base de datos (la papelera). Podrás volver a intentarlo en 3 semanas.»`
    ]);
    ui.rivMsg={ok:false,txt:`❌ Rechazado en ${tc.n} (${info.pct}% prob.): ${rejMsg}`};
    toast(`❌ Rechazado en ${tc.n} (${info.pct}% opciones)`);
    save();render();
  }
}

  if(sub==='corp'){

function wizBar(step){
  const steps=[['1','Personaje'],['2','Origen'],['3','Atributos'],['4','Empleo']];
  return '<div class="wiz-bar">'+steps.map(([n,lbl],i)=>{
    const st=i+1;
    const cls=st===step?'on':(st<step?'done':'');
    return `<button class="wiz-step ${cls}" data-a="wiz_go" data-v="${st}" ${st>step?'disabled':''}><span class="wn">${st<step?'✓':n}</span><span>${lbl}</span></button>`;
  }).join('')+'</div>';
}

  if(e.target&&e.target.id==='su-name')ui.suName=e.target.value;
  if(e.target&&e.target.id==='su-mono'){
    const val=e.target.value.replace(/[^a-zA-Z0-9]/g,'').toUpperCase().slice(0,3);
    const target=(g&&g.startup)?(ensureStartupFields(),g.startup.logo):(ui.suLogo=ui.suLogo||defaultSuLogo('🚀',ui.suMode==='hacker'));
    target.mono=val;target.mode='mono';target._touched=1;
    const prev=document.querySelector('.logo-preview');
    if(prev)prev.innerHTML=renderCustomStartupLogo(target,74);
    if(g&&g.startup)save();
  }
});
window.addEventListener('pagehide',()=>{if(g)save();});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&g)save();});
window.addEventListener('error',ev=>{
  const app=$('app');
  if(app&&(!app.innerHTML.trim()||app.querySelector('#boot-msg'))){
    app.innerHTML='<div class="card" style="margin:20px;padding:18px"><h3>⚠️ Error de inicio</h3><p class="sub">'+(ev&&ev.message||'Error desconocido')+'</p><button class="btn" onclick="try{localStorage.clear()}catch(e){}location.reload()">Reiniciar datos</button></div>';
  }
});

const BOOT_HTML='<div class="card" id="boot-msg" style="margin:20px;padding:18px"><h3>Cargando IT Tycoon…</h3><p class="sub">Si esta pantalla no cambia, el juego no ha podido arrancar. Pulsa el botón para reiniciar los datos guardados.</p><button class="btn w" onclick="try{localStorage.clear()}catch(e){}location.reload()">Reiniciar datos y recargar</button></div>';
function bootSafe(){
 try{render();if(location.protocol==='http:'||location.protocol==='https:')fbInit()}
 catch(err){const app=$('app');if(app)app.innerHTML='<div class="card" style="margin:20px;padding:18px"><h3>⚠️ Error de inicio</h3><p class="sub">'+String(err&&err.message||err)+'</p><button class="btn w" onclick="location.reload()">Reintentar</button> <button class="btn w" style="margin-top:8px" onclick="try{localStorage.clear()}catch(e){}location.reload()">Reiniciar datos</button></div>';return}
 setTimeout(()=>{try{if(ui.scr==='title'&&!document.querySelector('[data-a="new"]')){ui.scr='title';$('app').innerHTML='<div class="card" style="margin:20px;padding:18px"><h3>IT Tycoon</h3><button class="btn w" data-a="new">Nueva carrera</button></div>'}}catch(e){}},400)}

if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',bootSafe);
else bootSafe();

</script>
